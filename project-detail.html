<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0d0a">
  <meta name="description" content="Specimen dossier — Grace, field notebook of speculative biological architectures.">
  <meta name="author" content="Grace">

  <title>Specimen — Grace</title>

  <link rel="icon" type="image/jpeg" href="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/1727381403497-JUk88dYVSc6TzOJ2rhIArjrVSRvDab.jpeg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css?v=20260506a">
  <link rel="stylesheet" href="project-detail.css?v=20260506a">
</head>
<body class="dossier-page no-halo">

  <!-- Loading veil — see transitions.js for lifecycle -->
  <div class="page-veil" data-veil aria-hidden="true">
    <div class="page-veil-inner">
      <span class="page-veil-mark">◦</span>
      <span class="page-veil-line"></span>
      <span class="page-veil-text">DOSSIER</span>
    </div>
  </div>

  <!-- Background canvas — same drift as the index, just dialed lower -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- Leaf header -->
  <header class="leaf-header" aria-label="Field notebook header">
    <div class="leaf-row">
      <a class="leaf-meta" href="index.html">
        <span class="leaf-mark">←</span> back
      </a>
      <span class="leaf-folio" id="dossier-folio">FOLIO / —</span>
      <span class="leaf-meta" id="dossier-id">spec.— / —</span>
    </div>
    <div class="leaf-row leaf-row--right">
      <nav class="view-toggle" aria-label="View switch">
        <a href="index.html" class="view-toggle-item">network</a>
        <span class="view-toggle-sep">·</span>
        <a href="work.html" class="view-toggle-item">index</a>
      </nav>
    </div>
  </header>

  <!-- Hero — herbarium label -->
  <section class="dossier-head">
    <div class="dossier-rule"></div>
    <p class="dossier-kind" id="dossier-kind">— · —</p>
    <h1 class="dossier-name">
      <span class="dossier-genus" id="dossier-name-text">—</span>
      <span class="dossier-binomial" id="dossier-binomial">—</span>
    </h1>
    <p class="dossier-meta" id="dossier-meta">— · —</p>
    <p class="dossier-abstract" id="dossier-abstract"></p>
    <div class="dossier-rule"></div>
  </section>

  <!-- Plate sequence — vertical reading of the project's pages -->
  <main class="plates" id="plates" aria-label="Specimen plate sequence">
    <!-- populated by JS -->
  </main>

  <!-- Prev / next specimens -->
  <nav class="dossier-nav" aria-label="Adjacent specimens">
    <a class="dossier-nav-item dossier-nav-prev" id="dossier-prev" href="index.html">
      <span class="dossier-nav-label">prev. specimen</span>
      <span class="dossier-nav-name" id="dossier-prev-name">—</span>
    </a>
    <a class="dossier-nav-item dossier-nav-next" id="dossier-next" href="index.html">
      <span class="dossier-nav-label">next specimen</span>
      <span class="dossier-nav-name" id="dossier-next-name">—</span>
    </a>
  </nav>

  <footer class="leaf-footer">
    <span class="leaf-meta">— end of dossier —</span>
    <a class="leaf-meta" href="index.html">return to index</a>
  </footer>

  <div class="cursor-halo" id="cursor-halo" aria-hidden="true"></div>

  <script src="cursor.js?v=20260506a" defer></script>
  <script src="transitions.js?v=20260506a" defer></script>
  <script src="organic-bg.js?v=20260506a" defer></script>
  <script src="project-detail.js?v=20260506a" defer></script>
</body>
</html>
