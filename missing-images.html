<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missing Images — graceweb audit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'SF Mono', 'Fira Code', monospace; background: #fff; color: #333; padding: 3rem 2rem; line-height: 1.6; }
  h1 { font-size: 1.1rem; font-weight: 600; color: #111; margin-bottom: .3rem; }
  .subtitle { font-size: .72rem; color: #999; margin-bottom: 2rem; }
  .summary { font-size: .8rem; color: #555; margin-bottom: 2rem; padding: 1rem; background: #fafafa; border-radius: 6px; border: 1px solid #e5e5e5; }
  .summary strong { color: #111; }
  .filters { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
  .filter-btn { font-family: inherit; font-size: .7rem; padding: .3rem .7rem; border: 1px solid #ccc; border-radius: 4px; background: #f5f5f5; color: #666; cursor: pointer; transition: all .15s; }
  .filter-btn:hover { border-color: #999; color: #333; }
  .filter-btn.active { border-color: #d97706; color: #d97706; background: #fffbeb; }
  .section { margin-bottom: 2rem; }
  .section-title { font-size: .82rem; font-weight: 600; color: #d97706; text-transform: uppercase; letter-spacing: .08em; margin-bottom: .8rem; border-bottom: 1px solid #e5e5e5; padding-bottom: .5rem; }
  .item { display: flex; gap: 1rem; align-items: flex-start; padding: .75rem 0; border-bottom: 1px solid #f0f0f0; }
  .item:last-child { border-bottom: none; }
  .item.is-fixed { opacity: .5; }
  .item-body { flex: 1; }
  .stem { font-weight: 600; color: #111; font-size: .85rem; }
  .caption { color: #666; font-size: .78rem; margin-top: .15rem; }
  .meta { color: #999; font-size: .7rem; margin-top: .25rem; }
  .meta span { margin-right: 1.2rem; }
  .notes { color: #888; font-size: .7rem; margin-top: .3rem; font-style: italic; }
  .tag { display: inline-block; font-size: .62rem; padding: .1rem .4rem; border-radius: 3px; font-weight: 600; margin-right: .3rem; }
  .tag-missing { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
  .tag-fixed { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
  .tag-project { background: #eef2ff; color: #4f46e5; border: 1px solid #c7d2fe; }
  .empty { color: #999; font-size: .8rem; padding: 2rem 0; text-align: center; }
  .error { color: #dc2626; font-size: .8rem; padding: 2rem; background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; }
</style>
</head>
<body>

<h1>Missing Images — graceweb audit</h1>
<p class="subtitle">Data source: <code>missing-images.json</code> — edit JSON to update, this page is read-only.</p>

<div class="summary" id="summary"></div>
<div class="filters" id="filters"></div>
<div id="content"></div>

<script>
(async () => {
  const el = (id) => document.getElementById(id);

  let data;
  try {
    const res = await fetch('missing-images.json');
    data = await res.json();
  } catch (e) {
    el('content').innerHTML = `<div class="error">Failed to load missing-images.json: ${e.message}</div>`;
    return;
  }

  const missing = data.filter(d => d.status === 'missing');
  const fixed = data.filter(d => d.status === 'fixed');

  el('summary').innerHTML =
    `<strong>${missing.length}</strong> missing &nbsp;·&nbsp; ` +
    `<strong>${fixed.length}</strong> fixed &nbsp;·&nbsp; ` +
    `<strong>${data.length}</strong> total tracked`;

  let activeFilter = 'all';

  function renderFilters() {
    const projects = [...new Set(data.map(d => d.project))];
    el('filters').innerHTML =
      `<button class="filter-btn ${activeFilter === 'all' ? 'active' : ''}" data-f="all">All</button>` +
      `<button class="filter-btn ${activeFilter === 'missing' ? 'active' : ''}" data-f="missing">Missing</button>` +
      `<button class="filter-btn ${activeFilter === 'fixed' ? 'active' : ''}" data-f="fixed">Fixed</button>` +
      projects.map(p =>
        `<button class="filter-btn ${activeFilter === p ? 'active' : ''}" data-f="${p}">${p}</button>`
      ).join('');

    el('filters').querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFilter = btn.dataset.f;
        renderFilters();
        renderList();
      });
    });
  }

  function renderList() {
    let items = data;
    if (activeFilter === 'missing') items = missing;
    else if (activeFilter === 'fixed') items = fixed;
    else if (activeFilter !== 'all') items = data.filter(d => d.project === activeFilter);

    if (!items.length) {
      el('content').innerHTML = '<div class="empty">No issues match this filter.</div>';
      return;
    }

    const groups = {};
    items.forEach(d => {
      const key = d.status === 'fixed' ? '_fixed' : d.project;
      (groups[key] = groups[key] || []).push(d);
    });

    let html = '';
    for (const [group, list] of Object.entries(groups).sort((a, b) => a[0] === '_fixed' ? 1 : -1)) {
      const title = group === '_fixed' ? 'Fixed' : group;
      html += `<div class="section"><div class="section-title">${title}</div>`;
      for (const d of list) {
        const tagHtml = d.status === 'fixed'
          ? '<span class="tag tag-fixed">FIXED</span>'
          : '<span class="tag tag-missing">MISSING</span>';
        html += `
          <div class="item ${d.status === 'fixed' ? 'is-fixed' : ''}">
            <div class="item-body">
              <div>${tagHtml} <span class="tag tag-project">${d.project}</span></div>
              <div class="stem">${d.stem}</div>
              <div class="caption">${d.caption}</div>
              <div class="meta">
                <span>Source: ${d.source_file}${d.source_line ? ':' + d.source_line : ''}</span>
                ${d.fix_date ? `<span>Fixed: ${d.fix_date}</span>` : ''}
              </div>
              <div class="meta"><span>${d.expected_path}</span></div>
              ${d.notes ? `<div class="notes">${d.notes}</div>` : ''}
            </div>
          </div>`;
      }
      html += '</div>';
    }

    el('content').innerHTML = html;
  }

  renderFilters();
  renderList();
})();
</script>

</body>
</html>
