<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Editor — graceweb</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Cormorant Garamond', Georgia, serif; background: #fff; color: #222; line-height: 1.6; }

  /* ── toolbar ── */
  .toolbar { position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,.95); backdrop-filter: blur(12px); border-bottom: 1px solid #e0e0e0; padding: .45rem 1rem; display: flex; align-items: center; gap: .5rem; font-family: 'SF Mono', monospace; flex-wrap: wrap; }
  .toolbar h1 { font-size: .75rem; font-weight: 600; color: #707070; letter-spacing: .04em; }
  .proj-tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 100%; min-width: 0; order: 2; scrollbar-width: thin; }
  .tab { font-family: 'SF Mono', monospace; font-size: .75rem; padding: .45rem .7rem; border: 1px solid transparent; border-radius: 3px; background: none; color: #666; cursor: pointer; white-space: nowrap; transition: all .12s; min-height: 32px; }
  .tab:hover { color: #333; }
  .tab.active { color: #d97706; border-color: #d9770633; background: #fef3c70a; font-weight: 600; border-bottom: 2px solid #d97706; }
  .toolbar-gap { width: 1px; height: 16px; background: #ddd; flex-shrink: 0; }
  .status { font-size: .75rem; color: #707070; white-space: nowrap; }
  .status.has-changes { color: #d97706; }
  .btn { font-family: 'SF Mono', monospace; font-size: .75rem; padding: .35rem .7rem; border: 1px solid #ccc; border-radius: 3px; background: #f5f5f5; color: #555; cursor: pointer; transition: all .12s; white-space: nowrap; min-height: 32px; }
  .btn:hover { border-color: #999; color: #111; background: #eee; }
  .btn-primary { border-color: #d97706; color: #d97706; background: #fff; }
  .btn-primary:hover { background: #fffbeb; }
  .btn.pulse { animation: savePulse 1s infinite; }
  @keyframes savePulse { 0%,100%{ box-shadow: none; } 50%{ box-shadow: 0 0 8px #d9770644; } }

  /* ── page ── */
  .page { max-width: 880px; margin: 0 auto; padding: 3rem 2rem 8rem; }

  /* ── project header ── */
  .proj-no { font-family: 'SF Mono', monospace; font-size: .75rem; color: #707070; letter-spacing: .1em; text-transform: uppercase; margin-bottom: .3rem; }
  .proj-name { font-size: 2.4rem; font-weight: 300; font-style: italic; color: #111; margin-bottom: .15rem; }
  .proj-binomial { font-size: .95rem; font-style: italic; color: #666; margin-bottom: .25rem; }
  .proj-kind { font-family: 'SF Mono', monospace; font-size: .75rem; color: #666; letter-spacing: .04em; margin-bottom: .15rem; }
  .proj-meta { font-family: 'SF Mono', monospace; font-size: .75rem; color: #707070; margin-bottom: 1.2rem; }
  .proj-abstract { font-size: 1.05rem; color: #444; max-width: 640px; margin-bottom: 1.8rem; line-height: 1.75; }

  /* ── editable ── */
  [contenteditable] { border-bottom: 1px solid transparent; transition: border-color .15s, background .15s, outline-color .15s; padding: 1px 3px; margin: -1px -3px; border-radius: 2px; outline: 2px solid transparent; outline-offset: 1px; }
  [contenteditable]:hover { border-bottom-color: #ccc; }
  [contenteditable]:focus { border-bottom-color: #d97706; background: rgba(217,119,6,.04); outline-color: #d97706; }
  [contenteditable].changed { background: rgba(217,119,6,.06); border-bottom-color: #d97706; border-bottom-style: dashed; }

  /* ── global focus-visible ring ── */
  :focus-visible { outline: 2px solid #d97706; outline-offset: 2px; }
  .tab:focus-visible, .btn:focus-visible, .row-ctrl-btn:focus-visible, .crop-ratio-btn:focus-visible, .crop-reset-btn:focus-visible, .crop-apply-btn:focus-visible, .crop-cancel-btn:focus-visible, .crop-close-btn:focus-visible { outline: 2px solid #d97706; outline-offset: 2px; }

  /* ── metadata ── */
  .meta-table { font-family: 'SF Mono', monospace; font-size: .75rem; margin-bottom: 2rem; border-top: 1px solid #e5e5e5; }
  .meta-row { display: flex; border-bottom: 1px solid #f0f0f0; }
  .meta-key { width: 130px; flex-shrink: 0; padding: .3rem .5rem; color: #666; }
  .meta-val { flex: 1; padding: .3rem .5rem; color: #444; }

  .section-label { font-family: 'SF Mono', monospace; font-size: .75rem; color: #767676; letter-spacing: .06em; text-transform: uppercase; margin-bottom: .3rem; }
  .intro-prose { font-size: .95rem; color: #444; max-width: 620px; margin-bottom: 2rem; line-height: 1.75; }

  /* ── hero images ── */
  .hero-section { margin-bottom: 2.5rem; padding: 1rem; border: 1px solid #e5e5e5; border-radius: 4px; background: #fafafa; }
  .hero-section .section-label { margin-bottom: .8rem; }
  .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .hero-card { position: relative; }
  .hero-card-label { font-family: 'SF Mono', monospace; font-size: .75rem; color: #666; margin-bottom: .3rem; }
  .hero-card .hero-img-wrap { position: relative; overflow: hidden; border-radius: 2px; }
  .hero-card img { width: 100%; display: block; background: #f0f0f0; min-height: 60px; cursor: pointer; transition: opacity .15s; }
  .hero-card img:hover { opacity: .8; }
  .hero-card.crop-active img { cursor: grab; transition: none; }
  .hero-card.crop-active img:active { cursor: grabbing; }
  .hero-card.crop-active img:hover { opacity: 1; }
  .hero-card.crop-active { outline: 1px solid #d9770644; outline-offset: -1px; }
  .hero-card .replace-hint { position: absolute; top: 22px; right: 4px; font-family: 'SF Mono', monospace; font-size: .75rem; background: rgba(0,0,0,.7); color: #fff; padding: 2px 6px; border-radius: 2px; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .hero-card:hover .replace-hint { opacity: 1; }
  .hero-card .hero-path { font-family: 'SF Mono', monospace; font-size: .75rem; color: #666; margin-top: .15rem; }

  /* ── chapter ── */
  .chapter { margin-bottom: 2.8rem; }
  .ch-note { font-family: 'SF Mono', monospace; font-size: .75rem; color: #707070; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .25rem; }
  .ch-title { font-size: 1.35rem; font-weight: 300; font-style: italic; color: #222; margin-bottom: .6rem; }
  .ch-prose { font-size: .92rem; color: #444; max-width: 600px; margin-bottom: 1.2rem; line-height: 1.75; }

  /* ── images ── */
  .img-row-wrap { margin-bottom: 1.2rem; position: relative; }
  .img-row { margin-bottom: 0; display: grid; gap: .5rem; align-items: stretch; }
  .img-row img { width: 100%; display: block; border-radius: 2px; }
  .img-row .img-cell img.is-cropped { height: 100%; }
  .img-cell { position: relative; overflow: hidden; }
  .img-cell img { background: #f0f0f0; min-height: 50px; transition: opacity .15s; }
  .img-cell:hover img { opacity: .8; }
  .img-cap { font-family: 'SF Mono', monospace; font-size: .75rem; color: #666; margin-top: .2rem; }
  .img-explain-wrap { margin-top: .45rem; }
  .img-explain-label { font-family: 'SF Mono', monospace; font-size: .7rem; letter-spacing: .05em; color: #767676; text-transform: uppercase; margin-bottom: .18rem; }
  .img-explain {
    width: 100%;
    min-height: 78px;
    resize: vertical;
    border: 1px solid #e2e2e2;
    border-radius: 4px;
    padding: .45rem .55rem;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: .94rem;
    line-height: 1.55;
    color: #2f2f2f;
    background: #fff;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .img-explain:hover { border-color: #cfcfcf; }
  .img-explain:focus { border-color: #d97706; box-shadow: 0 0 0 2px rgba(217,119,6,.12); outline: none; }
  .img-explain.changed { border-style: dashed; background: rgba(217,119,6,.05); }
  .img-stem { font-family: 'SF Mono', monospace; font-size: .75rem; color: #666; margin-top: .05rem; }
  .row-cap { font-family: 'SF Mono', monospace; font-size: .75rem; color: #666; margin-top: .35rem; font-style: italic; }
  .img-missing { background: #fef2f2; border: 1px dashed #dc2626; border-radius: 2px; display: flex; align-items: center; justify-content: center; min-height: 100px; font-family: 'SF Mono', monospace; font-size: .75rem; color: #dc2626; cursor: pointer; }
  .img-missing:hover { background: #fee2e2; }
  .img-cell .img-toolbar { position: absolute; top: 4px; right: 4px; display: flex; gap: 2px; opacity: 0; transition: opacity .15s; z-index: 5; }
  .img-cell:hover .img-toolbar { opacity: 1; }
  .img-cell.crop-active .img-toolbar { opacity: 0; pointer-events: none; }
  .img-toolbar button { font-family: 'SF Mono', monospace; font-size: .75rem; background: rgba(0,0,0,.7); color: #fff; border: none; padding: 2px 6px; border-radius: 2px; cursor: pointer; transition: background .12s; }
  .img-toolbar button:hover { background: rgba(0,0,0,.9); }
  .img-toolbar button.tb-delete:hover { background: rgba(220,38,38,.85); }
  .img-cell .replaced-badge { position: absolute; top: 4px; left: 4px; font-family: 'SF Mono', monospace; font-size: .75rem; background: #d97706; color: #fff; padding: 1px 5px; border-radius: 2px; font-weight: 600; }
  .img-cell-deleted { min-height: 60px; display: flex; align-items: center; justify-content: center; background: #f5f5f5; border: 1px dashed #ddd; border-radius: 2px; }
  .img-cell-deleted span { font-family: 'SF Mono', monospace; font-size: .75rem; color: #999; }
  .img-cell.crop-active { outline: 1px solid #d9770644; outline-offset: -1px; }
  .img-cell.crop-active img { cursor: grab; transition: none; }
  .img-cell.crop-active img:active { cursor: grabbing; }
  .img-cell.crop-active img:hover { opacity: 1; }
  .img-cell img.is-cropped { object-fit: cover; }

  /* ── crop overlay modal ── */
  .crop-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(255,255,255,.94); backdrop-filter: blur(4px); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .crop-close-btn { position: absolute; top: 1rem; right: 1.5rem; font-family: 'SF Mono', monospace; font-size: 1.2rem; background: none; border: none; color: #707070; cursor: pointer; transition: color .12s; line-height: 1; padding: .4rem .6rem; z-index: 3; min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
  .crop-close-btn:hover { color: #333; }
  .crop-canvas { position: relative; max-width: 90vw; max-height: 74vh; user-select: none; line-height: 0; overflow: visible; }
  .crop-canvas > img { position: relative; z-index: 1; display: block; max-width: 90vw; max-height: 74vh; pointer-events: none; border-radius: 3px; box-shadow: 0 2px 20px rgba(0,0,0,.15); }
  /* Checkerboard fills the crop-box area; image sits on top, so checker only shows where crop extends past the image (= transparent-fill on render). */
  .crop-checker { position: absolute; z-index: 0; pointer-events: none;
    background-color: #f5f5f5;
    background-image:
      linear-gradient(45deg, #d4d4d4 25%, transparent 25%),
      linear-gradient(-45deg, #d4d4d4 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #d4d4d4 75%),
      linear-gradient(-45deg, transparent 75%, #d4d4d4 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
  }
  .crop-box { position: absolute; border: 2px solid #d97706; box-shadow: 0 0 0 9999px rgba(255,255,255,.6); cursor: move; z-index: 2; }
  .crop-handle { position: absolute; width: 14px; height: 14px; background: #d97706; border: 1px solid #fff; z-index: 3; border-radius: 1px; }
  .crop-handle.nw { top: -7px; left: -7px; cursor: nwse-resize; }
  .crop-handle.ne { top: -7px; right: -7px; cursor: nesw-resize; }
  .crop-handle.sw { bottom: -7px; left: -7px; cursor: nesw-resize; }
  .crop-handle.se { bottom: -7px; right: -7px; cursor: nwse-resize; }
  .crop-handle.n  { top: -7px; left: 50%; margin-left: -7px; cursor: ns-resize; }
  .crop-handle.s  { bottom: -7px; left: 50%; margin-left: -7px; cursor: ns-resize; }
  .crop-handle.w  { top: 50%; margin-top: -7px; left: -7px; cursor: ew-resize; }
  .crop-handle.e  { top: 50%; margin-top: -7px; right: -7px; cursor: ew-resize; }
  .crop-toolbar { display: flex; align-items: center; gap: .6rem; margin-top: .8rem; font-family: 'SF Mono', monospace; font-size: .75rem; flex-wrap: wrap; justify-content: center; }
  .crop-ratio-btn { font-family: 'SF Mono', monospace; font-size: .75rem; padding: .3rem .6rem; border: 1px solid #ccc; border-radius: 3px; background: #fff; color: #555; cursor: pointer; transition: all .12s; min-height: 32px; }
  .crop-ratio-btn:hover { border-color: #999; color: #333; }
  .crop-ratio-btn.active { border-color: #d97706; color: #d97706; }
  .crop-ratio-btn.bg-active { border-color: #111; color: #111; font-weight: 600; }
  .crop-info-display { color: #666; font-variant-numeric: tabular-nums; min-width: 120px; text-align: center; }
  .crop-toolbar .toolbar-gap { width: 1px; height: 14px; background: #ddd; flex-shrink: 0; }
  .crop-apply-btn { font-family: 'SF Mono', monospace; font-size: .75rem; padding: .3rem .7rem; border: 1px solid #22c55e; border-radius: 3px; background: #fff; color: #16a34a; cursor: pointer; transition: all .12s; min-height: 32px; }
  .crop-apply-btn:hover { background: #f0fdf4; }
  .crop-cancel-btn { font-family: 'SF Mono', monospace; font-size: .75rem; padding: .3rem .7rem; border: 1px solid #ccc; border-radius: 3px; background: #fff; color: #555; cursor: pointer; transition: all .12s; min-height: 32px; }
  .crop-cancel-btn:hover { border-color: #999; color: #333; }
  .trim-modal { width: min(820px, 92vw); background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: .8rem; box-shadow: 0 10px 40px rgba(0,0,0,.15); }
  .trim-video-preview { width: 100%; max-height: 52vh; background: #000; display: block; border-radius: 4px; }
  .trim-controls { margin-top: .7rem; display: grid; gap: .5rem; font-family: 'SF Mono', monospace; font-size: .75rem; }
  .trim-tabs { display: flex; gap: .4rem; flex-wrap: wrap; }
  .trim-tab { border: 1px solid #ccc; background: #fff; padding: .25rem .55rem; border-radius: 3px; cursor: pointer; }
  .trim-tab.active { border-color: #d97706; color: #d97706; }
  .trim-range { display: grid; grid-template-columns: 58px 1fr 72px; gap: .5rem; align-items: center; }
  .trim-range input[type="range"] { width: 100%; }

  /* ── crop preview in editor ── */
  .crop-preview-wrap { position: relative; overflow: hidden; border-radius: 2px; }
  .crop-preview-wrap img { position: absolute; top: 0; left: 0; display: block; height: auto; }

  /* ── visible-area dashed outline inside crop box ── */

  /* ── cell-frame: wraps crop preview with parent-context aspect ratio ── */
  .cell-frame { position: relative; overflow: hidden; width: 100%; container-type: size; }
  .cell-frame > .crop-preview-wrap { height: min(100cqh, calc(100cqw / var(--ar, 1))); aspect-ratio: var(--ar, 1); margin: auto; }
  .cell-frame .frame-hint { position: absolute; bottom: 4px; left: 4px; font-family: 'SF Mono', monospace; font-size: 10px; background: rgba(0,0,0,.6); color: #fff; padding: 1px 5px; border-radius: 2px; pointer-events: none; }

  /* ── row controls ── */
  .row-controls { display: flex; align-items: center; gap: .4rem; margin-bottom: .4rem; }
  .row-ctrl-btn { font-family: 'SF Mono', monospace; font-size: .75rem; background: #fff; border: 1px solid #ddd; color: #666; border-radius: 3px; padding: .25rem .5rem; cursor: pointer; transition: all .12s; min-height: 32px; }
  .row-ctrl-btn:hover { border-color: #999; color: #333; }
  .row-ctrl-btn.danger:hover { border-color: #dc2626; color: #dc2626; }
  .row-ctrl-label { font-family: 'SF Mono', monospace; font-size: .75rem; color: #767676; }

  /* ── chapter controls ── */
  .ch-controls { display: flex; align-items: center; gap: .4rem; margin-bottom: .3rem; padding-bottom: .3rem; border-bottom: 1px solid #e5e5e5; }

  /* ── save toast ── */
  .save-toast { position: fixed; bottom: 2rem; right: 2rem; z-index: 300; font-family: 'SF Mono', monospace; font-size: .75rem; padding: .5rem 1rem; border-radius: 4px; color: #fff; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .save-toast.show { opacity: 1; }
  .save-toast.ok { background: #166534; border: 1px solid #22c55e; }
  .save-toast.err { background: #7f1d1d; border: 1px solid #f87171; }

  /* ── reflection ── */
  .reflection { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid #e5e5e5; max-width: 600px; }
  .refl-label { font-family: 'SF Mono', monospace; font-size: .75rem; color: #707070; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .3rem; }
  .refl-title { font-size: 1.1rem; font-weight: 300; font-style: italic; color: #222; margin-bottom: .5rem; }
  .refl-para { font-size: .88rem; color: #555; margin-bottom: .6rem; line-height: 1.75; }

  .credits { margin-top: 1.8rem; padding-top: 1rem; border-top: 1px solid #e5e5e5; }
  .credits-label { font-family: 'SF Mono', monospace; font-size: .75rem; color: #707070; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .4rem; }

  .page-nav { display: flex; justify-content: space-between; margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid #e5e5e5; }
  .page-nav a { font-family: 'SF Mono', monospace; font-size: .75rem; color: #666; text-decoration: none; cursor: pointer; transition: color .12s; }
  .page-nav a:hover { color: #d97706; }
  .page-nav .nav-name { display: block; font-family: 'Cormorant Garamond', serif; font-size: .9rem; font-style: italic; color: #666; margin-top: .15rem; }

  .hidden-input { display: none; }
</style>
</head>
<body>

<div class="toolbar">
  <h1>EDITOR</h1>
  <div class="proj-tabs" id="tabs" role="tablist" aria-label="Project tabs"></div>
  <div class="toolbar-gap" aria-hidden="true"></div>
  <div class="status" id="status" aria-live="polite">No changes</div>
  <button class="btn" id="btn-reset">Reset</button>
  <button class="btn" id="btn-preview">Preview ↗</button>
  <button class="btn btn-primary" id="btn-save-disk">Save to project</button>
</div>

<div class="page" id="page"></div>
<div class="save-toast" id="save-toast" role="alert" aria-live="assertive"></div>
<input type="file" id="file-input" class="hidden-input" accept="image/*,video/*,.gif">

<script>
const JS_PATH   = 'project-detail.js';
const NET_PATH  = 'network.js';
const SPEC_PATH = 'specimens.js';
const IMG_BASE  = 'public/images/projects/extracted-portfolio/';
const HERO_BASE = 'public/images/projects/hero image/';

let srcText = '', netSrcText = '', specSrcText = '';
let originalData = null, data = null, order = [], currentId = null;

// hero paths keyed by project id: { network: 'path', specimens: 'path' }
let heroData = {};
let originalHeroData = {};

// replaced images: { key: { blob, url, name } }
const replacedImages = {};
// replaced videos/gifs: { key: { blob, url, name } }
const replacedVideos = {};

// crop edits: tracks cell paths where crop was toggled from original
const cropEdits = new Set();

// deleted images: tracks cell paths where image was deleted
const deletedImages = new Set();

/* ══════════════════════════════════════════════════════════════════════
   LOAD
   ══════════════════════════════════════════════════════════════════════ */

async function loadSource() {
  [srcText, netSrcText, specSrcText] = await Promise.all([
    fetch(JS_PATH).then(r => r.text()),
    fetch(NET_PATH).then(r => r.text()),
    fetch(SPEC_PATH).then(r => r.text()),
  ]);

  // parse DOSSIERS
  const dm = srcText.match(/const DOSSIERS\s*=\s*\{/);
  let depth = 0, end = dm.index;
  for (let i = dm.index; i < srcText.length; i++) {
    if (srcText[i] === '{') depth++;
    else if (srcText[i] === '}') { depth--; if (!depth) { end = i + 1; break; } }
  }
  data = new Function(srcText.slice(dm.index, end) + '; return DOSSIERS;')();
  originalData = JSON.parse(JSON.stringify(data));

  const om = srcText.match(/const ORDER\s*=\s*\[([^\]]+)\]/);
  order = om ? om[1].match(/'([^']+)'/g).map(s => s.replace(/'/g,'')) : Object.keys(data);

  // parse hero paths from network.js
  parseHeroes(netSrcText, 'network');
  parseHeroes(specSrcText, 'specimens');
  originalHeroData = JSON.parse(JSON.stringify(heroData));
}

function parseHeroes(src, source) {
  const heroBase = HERO_BASE;
  const base = IMG_BASE;
  const re = /id:\s*'([^']+)'[\s\S]*?hero:\s*(.+?)\s*[,\n}]/g;
  let m;
  while ((m = re.exec(src))) {
    const id = m[1];
    let expr = m[2].trim();
    let path;
    if (expr.startsWith('HERO_BASE')) {
      path = heroBase + expr.replace(/HERO_BASE\s*\+\s*/, '').replace(/^['"]|['"]$/g,'').trim();
    } else if (expr.startsWith('BASE')) {
      path = base + expr.replace(/BASE\s*\+\s*/, '').replace(/^['"]|['"]$/g,'').trim();
    } else {
      path = expr.replace(/^['"]|['"]$/g,'').trim();
      if (!path.startsWith('public/')) path = base + path;
    }
    if (!heroData[id]) heroData[id] = {};
    heroData[id][source] = path;
  }
  // parse heroCrop objects
  const cropRe = /id:\s*'([^']+)'[\s\S]*?heroCrop:\s*(\{[^}]+\})/g;
  let cm;
  while ((cm = cropRe.exec(src))) {
    const id = cm[1];
    try {
      const crop = new Function('return ' + cm[2])();
      if (!heroData[id]) heroData[id] = {};
      heroData[id][source + 'Crop'] = crop;
    } catch(e) {}
  }
}

/* ══════════════════════════════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════════════════════════════ */

function imgUrl(folder, stem) { return `${IMG_BASE}${folder}/images/webp/${stem}.webp`; }
function videoUrl(folder, name) { return `${IMG_BASE}${folder}/videos/${name}`; }
function isGifName(name) { return /\.gif$/i.test(name || ''); }

function ed(text, path) {
  const v = (text || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const label = path.split('.').pop().replace(/([A-Z])/g, ' $1').replace(/[_-]/g, ' ').trim();
  return `<span contenteditable="true" data-path="${path}" data-orig="${v}" aria-label="Edit ${label}">${v}</span>`;
}

function edTextarea(text, path, rows = 4, placeholder = 'Add explanation text') {
  const esc = (text || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const orig = encodeURIComponent(text || '');
  return `<textarea class="img-explain" data-path-input="${path}" data-orig-raw="${orig}" rows="${rows}" placeholder="${placeholder}" aria-label="Edit explanation">${esc}</textarea>`;
}

function setNested(obj, path, val) {
  const parts = path.split('.');
  const pid = parts.shift();
  let t = obj[pid];
  for (let i = 0; i < parts.length - 1; i++) t = t[isNaN(parts[i]) ? parts[i] : +parts[i]];
  t[isNaN(parts.at(-1)) ? parts.at(-1) : +parts.at(-1)] = val;
}

function getNested(obj, path) {
  const parts = path.split('.');
  const pid = parts.shift();
  let t = obj[pid];
  for (const k of parts) t = t[isNaN(k) ? k : +k];
  return t;
}

function tryGetNested(obj, path) {
  try {
    return getNested(obj, path);
  } catch {
    return null;
  }
}

// For a cell path like 'pid.chapters.0.rows.1.cells.3', return its row path 'pid.chapters.0.rows.1'
function rowPathOf(cp) {
  const i = cp.lastIndexOf('.cells.');
  return i === -1 ? null : cp.slice(0, i);
}

// Returns the cell object the user currently sees.
function getDisplayCell(cp) {
  return getNested(data, cp);
}

function cropBgValue(cr) {
  return (cr && (cr.bg === 'black' || cr.bg === 'white' || cr.bg === 'transparent'))
    ? cr.bg
    : 'transparent';
}

function cropBgCss(cr) {
  const bg = cropBgValue(cr);
  if (bg === 'black') return '#000';
  if (bg === 'white') return '#fff';
  return 'transparent';
}

// Returns the count of (non-deleted) cells in the row at the given row path.
function rowCellCount(rp) {
  try {
    const row = getNested(data, rp);
    return (row.cells || []).filter(c => !c._deleted).length;
  } catch { return 0; }
}

/* ══════════════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════════════ */

function getFrameAspect(cp) {
  const rp = rowPathOf(cp);
  if (!rp) return null;
  const n = rowCellCount(rp);
  const vpAR = window.innerWidth / window.innerHeight;
  if (n <= 1) return { ar: vpAR, label: 'fullbleed viewport' };
  return { ar: vpAR / n, label: `${n}-up pane` };
}

function renderCell(cell, folder, cp) {
  if (cell._deleted) {
    return `<div class="img-cell"><div class="img-missing" tabindex="0" role="button" data-cell-path="${cp}" data-folder="${folder}">add media: ${cell.img || cell.video || 'new-media'}</div></div>`;
  }

  const replaced = replacedImages[cp];
  const replacedVideo = replacedVideos[cp];
  const isVideoCell = !!(cell.video || replacedVideo);
  const src = isVideoCell
    ? (replacedVideo ? replacedVideo.url : videoUrl(folder, cell.video))
    : (replaced ? replaced.url : imgUrl(folder, cell.img));
  const badge = (replaced || replacedVideo) ? '<span class="replaced-badge">NEW</span>' : '';
  const cr = cell.crop || null;
  const hasCrop = !!cr;
  const newCrop = isNewCrop(cr);

  let imgHtml;
  if (isVideoCell) {
    const trim = cell.videoTrim || null;
    const trimAttrs = trim ? ` data-vstart="${trim.start || 0}" data-vend="${trim.end || 0}"` : '';
    if (isGifName(replacedVideo?.name || cell.video)) {
      imgHtml = `<img src="${src}" alt="" loading="lazy" data-cell-path="${cp}" data-folder="${folder}">`;
    } else {
      imgHtml = `<video src="${src}" data-cell-path="${cp}" data-folder="${folder}"${trimAttrs} autoplay loop muted playsinline preload="metadata" style="width:100%;display:block;background:#000"></video>`;
    }
  } else if (newCrop) {
    const { x, y, w, h, nat } = cr;
    const [nw, nh] = nat;
    const ratio = nw && nh ? ((w * nw) / (h * nh)).toFixed(4) : 'auto';
    const imgW = (100 / w * 100).toFixed(2);
    const imgL = (-x / w * 100).toFixed(2);
    const imgT = (-y / h * 100).toFixed(2);
    const inner = `<div class="crop-preview-wrap" style="aspect-ratio:${ratio};--ar:${ratio};background:${cropBgCss(cr)}">
      <img src="${src}" alt="" loading="lazy" data-cell-path="${cp}" data-folder="${folder}"
        style="width:${imgW}%;left:${imgL}%;top:${imgT}%"
        onerror="this.parentElement.outerHTML='<div class=img-missing tabindex=0 role=button data-cell-path=\\'${cp}\\' data-folder=\\'${folder}\\'>add image: ${cell.img}</div>'">
    </div>`;
    const frame = getFrameAspect(cp);
    if (frame) {
      imgHtml = `<div class="cell-frame" style="aspect-ratio:${frame.ar.toFixed(4)};display:flex;align-items:center;justify-content:center;overflow:hidden">${inner}</div>`;
    } else {
      imgHtml = inner;
    }
  } else if (hasCrop) {
    const s = cr.s, x = cr.x, y = cr.y;
    imgHtml = `<img src="${src}" alt="" loading="lazy" data-cell-path="${cp}" data-folder="${folder}" class="is-cropped"
      style="object-fit:cover;transform:scale(${s});transform-origin:${x}% ${y}%"
      onerror="this.outerHTML='<div class=img-missing tabindex=0 role=button data-cell-path=\\'${cp}\\' data-folder=\\'${folder}\\'>add image: ${cell.img}</div>'">`;
  } else {
    imgHtml = `<img src="${src}" alt="" loading="lazy" data-cell-path="${cp}" data-folder="${folder}"
      onerror="this.outerHTML='<div class=img-missing tabindex=0 role=button data-cell-path=\\'${cp}\\' data-folder=\\'${folder}\\'>add image: ${cell.img}</div>'">`;
  }

  const toolbarHtml = `<div class="img-toolbar">
    ${isVideoCell ? '' : `<button data-tb="edit" data-cell-path="${cp}">edit</button>`}
    ${isVideoCell ? `<button data-tb="trim-video" data-cell-path="${cp}">trim</button>` : ''}
    <button data-tb="move-left" data-cell-path="${cp}">←</button>
    <button data-tb="move-right" data-cell-path="${cp}">→</button>
    <button data-tb="replace" data-cell-path="${cp}">replace</button>
    <button data-tb="delete" data-cell-path="${cp}" class="tb-delete">delete</button>
  </div>`;

  return `<div class="img-cell" data-crop-cell="${hasCrop ? cp : ''}">
    ${imgHtml}
    ${toolbarHtml}
    ${badge}
    <div class="img-explain-wrap">
      <div class="img-explain-label">Explanation</div>
      ${edTextarea(cell.explain !== undefined ? cell.explain : (cell.cap || ''), cp + '.explain', 4, 'Write explanation paragraph for this media')}
    </div>
    <div class="img-stem">${cell.img || cell.video || ''}</div>
  </div>`;
}

function renderRow(row, folder, rp) {
  const cells = row.cells || [];
  const activeCount = cells.filter(c => !c._deleted).length;
  const cols = Math.max(activeCount, 1);
  const style = cols > 1 ? ` style="grid-template-columns:repeat(${cols},1fr)"` : '';
  const layoutLabel = activeCount <= 1 ? '1 image · fullbleed'
                    : `${activeCount} images · split ${activeCount}-up`;

  let h = `<div class="img-row-wrap">`;

  // controls
  h += `<div class="row-controls">`;
  h += `<span class="row-ctrl-label">${layoutLabel}</span>`;
  h += `<button class="row-ctrl-btn" data-action="move-row-up" data-row-path="${rp}">↑ group</button>`;
  h += `<button class="row-ctrl-btn" data-action="move-row-down" data-row-path="${rp}">↓ group</button>`;
  h += `<button class="row-ctrl-btn" data-action="add-cell" data-row-path="${rp}">+ cell</button>`;
  h += `<button class="row-ctrl-btn danger" data-action="delete-row" data-row-path="${rp}">× delete group</button>`;
  h += `</div>`;

  h += `<div class="img-row"${style}>`;
  cells.forEach((c, ci) => { h += renderCell(c, folder, rp+'.cells.'+ci); });
  h += '</div>';

  if (row.cap !== undefined && row.cap !== null) h += `<div class="row-cap">${ed(row.cap, rp+'.cap')}</div>`;
  h += '</div>';
  return h;
}

function renderHeroSection(id) {
  const heroes = heroData[id];
  if (!heroes) return '';

  let h = '<div class="hero-section"><div class="section-label">Cover Images (network & specimens)</div><div class="hero-grid">';

  for (const source of ['network', 'specimens']) {
    const path = heroes[source];
    if (!path) continue;
    const replaced = replacedImages[`hero:${id}:${source}`];
    const src = replaced ? replaced.url : path;
    const badge = replaced ? '<span class="replaced-badge" style="position:absolute;top:22px;left:4px">NEW</span>' : '';
    const cropKey = source + 'Crop';
    const cr = heroes[cropKey] || null;
    const hasCrop = !!cr;
    const newCrop = isNewCrop(cr);
    const hcKey = `hero:${id}:${source}`;

    let heroImgHtml;
    if (newCrop) {
      const { x, y, w, h: ch, nat } = cr;
      const [nw, nh] = nat;
      const ratio = nw && nh ? ((w * nw) / (ch * nh)).toFixed(4) : 'auto';
      const imgW = (100 / w * 100).toFixed(2);
      const imgL = (-x / w * 100).toFixed(2);
      const imgT = (-y / ch * 100).toFixed(2);
      heroImgHtml = `<div class="crop-preview-wrap" style="aspect-ratio:${ratio};background:${cropBgCss(cr)}">
        <img src="${src}" alt="" loading="lazy" data-hero-id="${id}" data-hero-source="${source}"
          style="width:${imgW}%;left:${imgL}%;top:${imgT}%"
          onerror="this.style.minHeight='80px';this.style.border='1px dashed #7f1d1d'">
      </div>`;
    } else if (hasCrop) {
      const s = cr.s, x = cr.x, y = cr.y;
      heroImgHtml = `<img src="${src}" alt="" loading="lazy" data-hero-id="${id}" data-hero-source="${source}"
        style="object-fit:cover;transform:scale(${s});transform-origin:${x}% ${y}%"
        onerror="this.style.minHeight='80px';this.style.border='1px dashed #7f1d1d'">`;
    } else {
      heroImgHtml = `<img src="${src}" alt="" loading="lazy" data-hero-id="${id}" data-hero-source="${source}"
        onerror="this.style.minHeight='80px';this.style.border='1px dashed #7f1d1d'">`;
    }

    let cropHtml = `<div class="crop-controls">
      <label class="crop-toggle-row"><input type="checkbox" data-crop-toggle="${hcKey}" ${hasCrop ? 'checked' : ''}><span>crop</span></label>`;
    if (hasCrop) {
      if (newCrop) {
        cropHtml += `<span class="crop-info">${cr.w.toFixed(1)}% × ${cr.h.toFixed(1)}%</span>`;
      } else {
        cropHtml += `<span class="crop-info">${cr.s.toFixed(2)}× · ${Math.round(cr.x)}%, ${Math.round(cr.y)}%</span>`;
      }
      cropHtml += `<button class="crop-reset-btn" data-crop-edit="${hcKey}">edit</button>`;
      cropHtml += `<button class="crop-reset-btn" data-crop-reset="${hcKey}">remove</button>`;
    }
    cropHtml += '</div>';

    h += `<div class="hero-card" data-crop-cell="${hasCrop ? hcKey : ''}" data-hero-crop-key="${hcKey}">
      <div class="hero-card-label">${source}</div>
      <div class="hero-img-wrap">
        ${heroImgHtml}
        <span class="replace-hint">replace image</span>
        ${badge}
      </div>
      ${cropHtml}
      <div class="hero-path">${path}</div>
    </div>`;
  }

  h += '</div></div>';
  return h;
}

function findFirstImageCellInData(d) {
  for (const ch of d.chapters || []) {
    for (const row of ch.rows || []) {
      const cells = Array.isArray(row) ? row : row.cells;
      const c = (cells || [])[0];
      if (c && (c.img || c.video)) return c;
    }
  }
  return null;
}

function renderIntroHeroSection(d, id) {
  const introCfg = d.intro || null;
  const usingCustom = !!(introCfg && (introCfg.img || introCfg.video));
  const fallbackCell = !usingCustom ? findFirstImageCellInData(d) : null;
  const cp = `intro:${id}`;
  const stem = usingCustom ? (introCfg.img || introCfg.video) : (fallbackCell?.img || '');
  const replaced = replacedImages[cp];
  const replacedVideo = replacedVideos[cp];
  const isVideo = !!(introCfg?.video || replacedVideo);
  const src = replacedVideo ? replacedVideo.url
    : replaced ? replaced.url
    : (stem ? (isVideo ? videoUrl(d.folder, stem) : imgUrl(d.folder, stem)) : '');
  const cr = usingCustom ? (introCfg.crop || null) : (fallbackCell?.crop || null);
  const hasCrop = !!cr;
  const newCrop = isNewCrop(cr);

  let imgHtml;
  if (isVideo && src) {
    const trim = introCfg?.videoTrim || null;
    const trimAttrs = trim ? ` data-vstart="${trim.start || 0}" data-vend="${trim.end || 0}"` : '';
    imgHtml = `<video src="${src}" alt="" loading="lazy" data-intro-id="${id}"${trimAttrs} autoplay loop muted playsinline preload="metadata" style="width:100%;display:block;background:#000"></video>`;
  } else if (src && newCrop) {
    const { x, y, w, h: ch, nat } = cr;
    const [nw, nh] = nat;
    const ratio = nw && nh ? ((w * nw) / (ch * nh)).toFixed(4) : 'auto';
    const imgW = (100 / w * 100).toFixed(2);
    const imgL = (-x / w * 100).toFixed(2);
    const imgT = (-y / ch * 100).toFixed(2);
    imgHtml = `<div class="crop-preview-wrap" style="aspect-ratio:${ratio};background:${cropBgCss(cr)}">
      <img src="${src}" alt="" loading="lazy" data-intro-id="${id}"
        style="width:${imgW}%;left:${imgL}%;top:${imgT}%">
    </div>`;
  } else if (src && hasCrop) {
    imgHtml = `<img src="${src}" alt="" loading="lazy" data-intro-id="${id}"
      style="object-fit:cover;transform:scale(${cr.s});transform-origin:${cr.x}% ${cr.y}%">`;
  } else if (src) {
    imgHtml = `<img src="${src}" alt="" loading="lazy" data-intro-id="${id}">`;
  } else {
    imgHtml = `<div class="img-missing" data-cell-path="${cp}" tabindex="0" role="button">add hero media</div>`;
  }

  const badge = replaced ? '<span class="replaced-badge" style="position:absolute;top:22px;left:4px">NEW</span>' : '';
  const sourceLabel = usingCustom
    ? (replaced ? `custom · ${replaced.name}` : `custom · ${stem}`)
    : `fallback · chapter 1 / cell 1 (${stem || 'none'})`;

  const editBtn = (src && !isVideo) ? `<button class="row-ctrl-btn" data-tb="edit" data-cell-path="${cp}">crop</button>` : '';
  const trimBtn = (src && isVideo) ? `<button class="row-ctrl-btn" data-tb="trim-video" data-cell-path="${cp}">trim video</button>` : '';
  const replaceBtn = `<button class="row-ctrl-btn" data-tb="replace" data-cell-path="${cp}">${usingCustom || replaced || replacedVideo ? 'replace' : 'use custom media'}</button>`;
  const clearBtn = (usingCustom || replaced) ? `<button class="row-ctrl-btn" data-tb="intro-clear" data-cell-path="${cp}">revert to fallback</button>` : '';
  const cropResetBtn = (usingCustom && hasCrop) ? `<button class="row-ctrl-btn" data-tb="intro-reset-crop" data-cell-path="${cp}">remove crop</button>` : '';

  let cropInfo = '';
  if (hasCrop) {
    if (newCrop) cropInfo = `<span class="crop-info">${cr.w.toFixed(1)}% × ${cr.h.toFixed(1)}%</span>`;
    else cropInfo = `<span class="crop-info">${cr.s.toFixed(2)}× · ${Math.round(cr.x)}%, ${Math.round(cr.y)}%</span>`;
  }

  return `<div class="hero-section"><div class="section-label">Hero (intro section)</div>
    <div class="hero-grid" style="grid-template-columns:1fr">
      <div class="hero-card" data-crop-cell="${hasCrop ? cp : ''}">
        <div class="hero-card-label">${sourceLabel}</div>
        <div class="hero-img-wrap" style="max-width:380px">
          ${imgHtml}
          ${badge}
        </div>
        <div class="crop-controls" style="margin-top:.4rem;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap">
          ${editBtn}${trimBtn}${replaceBtn}${cropResetBtn}${clearBtn}${cropInfo}
        </div>
      </div>
    </div>
  </div>`;
}

function showProject(id, preserveScroll) {
  currentId = id;
  const d = data[id], base = id;
  const idx = order.indexOf(id);
  const prevId = idx > 0 ? order[idx-1] : null;
  const nextId = idx < order.length-1 ? order[idx+1] : null;

  document.querySelectorAll('.tab').forEach(t => {
    const isActive = t.dataset.id === id;
    t.classList.toggle('active', isActive);
    t.setAttribute('aria-selected', isActive);
  });

  let h = '';
  h += `<div class="proj-no">${ed(d.no, base+'.no')}</div>`;
  h += `<div class="proj-name">${ed(d.name, base+'.name')}</div>`;
  h += `<div class="proj-binomial">${ed(d.binomial, base+'.binomial')}</div>`;
  h += `<div class="proj-kind">${ed(d.kind, base+'.kind')}</div>`;
  h += `<div class="proj-meta">${ed(d.meta, base+'.meta')}</div>`;
  h += `<div class="proj-abstract">${ed(d.abstract, base+'.abstract')}</div>`;

  // hero images
  h += renderHeroSection(id);
  h += renderIntroHeroSection(d, id);

  // metadata
  if (d.metadata?.length) {
    h += '<div class="meta-table">';
    d.metadata.forEach(([k,v],i) => { h += `<div class="meta-row"><div class="meta-key">${ed(k,base+'.metadata.'+i+'.0')}</div><div class="meta-val">${ed(v,base+'.metadata.'+i+'.1')}</div></div>`; });
    h += '</div>';
  }

  if (d.intro?.length) {
    h += '<div class="section-label">Intro</div>';
    d.intro.forEach((p,i) => { h += `<div class="intro-prose">${ed(p,base+'.intro.'+i)}</div>`; });
  }

  (d.chapters||[]).forEach((ch,ci) => {
    const cp = base+'.chapters.'+ci;
    h += '<div class="chapter">';
    h += `<div class="ch-controls">`;
    h += `<span class="row-ctrl-label">Chapter ${ci+1}</span>`;
    h += `<button class="row-ctrl-btn" data-action="add-row" data-chapter-path="${cp}">+ image group</button>`;
    h += `<button class="row-ctrl-btn danger" data-action="delete-chapter" data-chapter-idx="${ci}">× delete</button>`;
    h += `</div>`;
    h += `<div class="ch-note">${ed(ch.note,cp+'.note')}</div>`;
    h += `<div class="ch-title">${ed(ch.title,cp+'.title')}</div>`;
    (ch.prose||[]).forEach((p,pi) => { h += `<div class="ch-prose">${ed(p,cp+'.prose.'+pi)}</div>`; });
    (ch.rows||[]).forEach((row,ri) => { h += renderRow(row, d.folder, cp+'.rows.'+ri); });
    h += '</div>';
  });

  if (d.reflection) {
    h += '<div class="reflection"><div class="refl-label">Reflection</div>';
    h += `<div class="refl-title">${ed(d.reflection.title,base+'.reflection.title')}</div>`;
    (d.reflection.paragraphs||[]).forEach((p,i) => { h += `<div class="refl-para">${ed(p,base+'.reflection.paragraphs.'+i)}</div>`; });
    h += '</div>';
  }

  if (d.credits?.length) {
    h += '<div class="credits"><div class="credits-label">Credits</div><div class="meta-table">';
    d.credits.forEach(([k,v],i) => { h += `<div class="meta-row"><div class="meta-key">${ed(k,base+'.credits.'+i+'.0')}</div><div class="meta-val">${ed(v,base+'.credits.'+i+'.1')}</div></div>`; });
    h += '</div></div>';
  }

  h += '<div class="page-nav">';
  h += prevId ? `<a data-nav="${prevId}">← prev<span class="nav-name">${data[prevId].name}</span></a>` : '<span></span>';
  h += nextId ? `<a data-nav="${nextId}">next →<span class="nav-name">${data[nextId].name}</span></a>` : '<span></span>';
  h += '</div>';

  document.getElementById('page').innerHTML = h;
  if (!preserveScroll) window.scrollTo(0, 0);
  attachAll();
}

/* ══════════════════════════════════════════════════════════════════════
   EVENT BINDING
   ══════════════════════════════════════════════════════════════════════ */

function attachAll() {
  attachEditable();
  attachNav();
  attachImageClick();
  attachHeroClick();
  attachRowControls();
  attachToolbarActions();
  attachChapterControls();
  setupEditorVideoTrimLoops();
}

function setupEditorVideoTrimLoops() {
  document.querySelectorAll('video[data-vstart], video[data-vend]').forEach(v => {
    const start = Number(v.dataset.vstart || 0);
    const end = Number(v.dataset.vend || 0);
    const applyStart = () => { if (v.currentTime < start) v.currentTime = start; };
    v.addEventListener('loadedmetadata', applyStart, { once: true });
    if (end > start) {
      v.addEventListener('timeupdate', () => { if (v.currentTime >= end) v.currentTime = start; });
    }
  });
}

function getCropObj(key) {
  if (key.startsWith('hero:')) {
    const [, id, source] = key.split(':');
    return heroData[id]?.[source + 'Crop'] || null;
  }
  if (key.startsWith('intro:')) {
    const id = key.slice('intro:'.length);
    return data[id]?.intro?.crop || null;
  }
  return getDisplayCell(key).crop || null;
}
function isNewCrop(cr) { return cr && cr.w !== undefined; }
function setCropObj(key, val) {
  if (key.startsWith('hero:')) {
    const [, id, source] = key.split(':');
    if (val) heroData[id][source + 'Crop'] = val;
    else delete heroData[id][source + 'Crop'];
  } else if (key.startsWith('intro:')) {
    const id = key.slice('intro:'.length);
    if (!data[id].intro) data[id].intro = { img: '' };
    if (val) data[id].intro.crop = val;
    else delete data[id].intro.crop;
  } else {
    const cell = getDisplayCell(key);
    if (val) cell.crop = val;
    else delete cell.crop;
  }
}

/* ── crop overlay modal ── */

const CROP_RATIOS = [
  { label: 'Free', value: null },
  { label: '1:1', value: 1 },
  { label: '4:3', value: 4/3 },
  { label: '3:4', value: 3/4 },
  { label: '16:9', value: 16/9 },
  { label: '9:16', value: 9/16 },
];

function openCropOverlay(cp) {
  const existing = getCropObj(cp);

  // resolve image src
  const replaced = replacedImages[cp];
  let imgSrc;
  if (replaced) {
    imgSrc = replaced.url;
  } else if (cp.startsWith('hero:')) {
    const [, id, source] = cp.split(':');
    imgSrc = heroData[id]?.[source] || '';
  } else if (cp.startsWith('intro:')) {
    const id = cp.slice('intro:'.length);
    const introCfg = data[id]?.intro;
    if (introCfg?.img) {
      imgSrc = imgUrl(data[id].folder, introCfg.img);
    } else {
      const fc = (function findFirst() {
        for (const ch of data[id].chapters || []) {
          for (const row of ch.rows || []) {
            const cells = Array.isArray(row) ? row : row.cells;
            const c = (cells || [])[0];
            if (c && c.img) return c;
          }
        }
        return null;
      })();
      imgSrc = fc ? imgUrl(data[id].folder, fc.img) : '';
    }
  } else {
    const cell = getDisplayCell(cp);
    imgSrc = imgUrl(cell._folder || data[cp.split('.')[0]].folder, cell.img);
  }

  // state
  let box = { x: 0, y: 0, w: 100, h: 100 };
  if (isNewCrop(existing)) {
    box = { x: existing.x, y: existing.y, w: existing.w, h: existing.h };
  }
  let fillBg = cropBgValue(existing);
  let lockedRatio = null; // width/height in image-pixel space
  let natW = 0, natH = 0;

  // build DOM
  const overlay = document.createElement('div');
  overlay.className = 'crop-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', 'Crop image');

  const canvas = document.createElement('div');
  canvas.className = 'crop-canvas';

  // Checkerboard sits behind the image; only visible where crop extends past image bounds.
  const cropChecker = document.createElement('div');
  cropChecker.className = 'crop-checker';
  cropChecker.setAttribute('aria-hidden', 'true');
  canvas.appendChild(cropChecker);

  const img = document.createElement('img');
  img.src = imgSrc;
  canvas.appendChild(img);

  const cropBox = document.createElement('div');
  cropBox.className = 'crop-box';
  canvas.appendChild(cropBox);

  const dirs = ['nw','n','ne','e','se','s','sw','w'];
  dirs.forEach(d => {
    const h = document.createElement('div');
    h.className = `crop-handle ${d}`;
    h.dataset.dir = d;
    cropBox.appendChild(h);
  });

  // toolbar
  const toolbar = document.createElement('div');
  toolbar.className = 'crop-toolbar';

  const infoEl = document.createElement('span');
  infoEl.className = 'crop-info-display';

  CROP_RATIOS.forEach((r, i) => {
    const btn = document.createElement('button');
    btn.className = 'crop-ratio-btn' + (i === 0 ? ' active' : '');
    btn.dataset.ratio = String(i);
    btn.textContent = r.label;
    btn.addEventListener('click', () => {
      toolbar.querySelectorAll('.crop-ratio-btn[data-ratio]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      lockedRatio = r.value;
      if (lockedRatio !== null) applyRatioToBox();
      updateBoxDOM();
    });
    toolbar.appendChild(btn);
  });

  const gap1 = document.createElement('div');
  gap1.className = 'toolbar-gap';
  toolbar.appendChild(gap1);
  toolbar.appendChild(infoEl);

  const gap2 = document.createElement('div');
  gap2.className = 'toolbar-gap';
  toolbar.appendChild(gap2);

  const bgButtons = [
    { label: 'bg: transparent', value: 'transparent' },
    { label: 'bg: white', value: 'white' },
    { label: 'bg: black', value: 'black' },
  ];
  const bgBtnEls = [];
  bgButtons.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'crop-ratio-btn';
    btn.textContent = opt.label;
    btn.dataset.bg = opt.value;
    btn.addEventListener('click', () => {
      fillBg = opt.value;
      bgBtnEls.forEach(b => b.classList.toggle('bg-active', b.dataset.bg === fillBg));
      updateBoxDOM();
    });
    bgBtnEls.push(btn);
    toolbar.appendChild(btn);
  });
  bgBtnEls.forEach(b => b.classList.toggle('bg-active', b.dataset.bg === fillBg));

  const gapBg = document.createElement('div');
  gapBg.className = 'toolbar-gap';
  toolbar.appendChild(gapBg);

  const resetBtn = document.createElement('button');
  resetBtn.className = 'crop-cancel-btn';
  resetBtn.textContent = 'reset';
  resetBtn.addEventListener('click', () => {
    box = { x: 0, y: 0, w: 100, h: 100 };
    fillBg = 'transparent';
    bgBtnEls.forEach(b => b.classList.toggle('bg-active', b.dataset.bg === fillBg));
    lockedRatio = null;
    toolbar.querySelectorAll('.crop-ratio-btn[data-ratio]').forEach((b,i) => b.classList.toggle('active', i===0));
    updateBoxDOM();
  });
  toolbar.appendChild(resetBtn);

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'crop-cancel-btn';
  cancelBtn.textContent = 'cancel';
  cancelBtn.addEventListener('click', closeOverlay);
  toolbar.appendChild(cancelBtn);

  const applyBtn = document.createElement('button');
  applyBtn.className = 'crop-apply-btn';
  applyBtn.textContent = 'apply';
  applyBtn.addEventListener('click', () => {
    const cropVal = {
      x: +box.x.toFixed(1),
      y: +box.y.toFixed(1),
      w: +box.w.toFixed(1),
      h: +box.h.toFixed(1),
      nat: [natW, natH],
      bg: fillBg
    };
    if (cropVal.x === 0 && cropVal.y === 0 && cropVal.w === 100 && cropVal.h === 100) {
      setCropObj(cp, null);
    } else {
      setCropObj(cp, cropVal);
    }
    markCropEdit(cp);
    closeOverlay();
    showProject(currentId, true);
    updateStatus();
  });
  toolbar.appendChild(applyBtn);

  const closeBtn = document.createElement('button');
  closeBtn.className = 'crop-close-btn';
  closeBtn.textContent = '✕';
  closeBtn.setAttribute('aria-label', 'Close crop editor');
  closeBtn.addEventListener('click', closeOverlay);
  overlay.appendChild(closeBtn);

  overlay.appendChild(canvas);
  overlay.appendChild(toolbar);
  document.body.appendChild(overlay);

  const triggerEl = document.activeElement;
  closeBtn.focus();

  function closeOverlay() {
    overlay.remove();
    document.removeEventListener('keydown', onKey);
    if (triggerEl && triggerEl.focus) triggerEl.focus();
  }

  function onKey(e) {
    if (e.key === 'Escape') { closeOverlay(); return; }
    if (e.key === 'Enter') { applyBtn.click(); return; }
    if (e.key === 'Tab') {
      const focusable = overlay.querySelectorAll('button, [tabindex]:not([tabindex="-1"])');
      if (!focusable.length) return;
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }
  document.addEventListener('keydown', onKey);

  // wait for image to load to get natural dimensions
  img.onload = () => {
    natW = img.naturalWidth;
    natH = img.naturalHeight;
    updateBoxDOM();
  };
  if (img.complete && img.naturalWidth) {
    natW = img.naturalWidth;
    natH = img.naturalHeight;
    updateBoxDOM();
  }

  function applyRatioToBox() {
    if (!lockedRatio || !natW) return;
    // lockedRatio = output width/height in pixels
    // convert to percentage space: w_pct * natW / (h_pct * natH) = lockedRatio
    // so w_pct = h_pct * lockedRatio * natH / natW
    const cx = box.x + box.w / 2;
    const cy = box.y + box.h / 2;
    let newW = box.w;
    let newH = newW * natW / (lockedRatio * natH);
    if (newH > 100) {
      newH = 100;
      newW = newH * lockedRatio * natH / natW;
    }
    if (newW > 100) {
      newW = 100;
      newH = newW * natW / (lockedRatio * natH);
    }
    let newX = cx - newW / 2;
    let newY = cy - newH / 2;
    if (newX < 0) newX = 0;
    if (newY < 0) newY = 0;
    if (newX + newW > 100) newX = 100 - newW;
    if (newY + newH > 100) newY = 100 - newH;
    box = { x: Math.max(0, newX), y: Math.max(0, newY), w: newW, h: newH };
  }

  function updateBoxDOM() {
    cropBox.style.left = box.x + '%';
    cropBox.style.top = box.y + '%';
    cropBox.style.width = box.w + '%';
    cropBox.style.height = box.h + '%';
    cropChecker.style.left = box.x + '%';
    cropChecker.style.top = box.y + '%';
    cropChecker.style.width = box.w + '%';
    cropChecker.style.height = box.h + '%';
    if (fillBg === 'transparent') {
      cropChecker.style.backgroundColor = '#f5f5f5';
      cropChecker.style.backgroundImage =
        'linear-gradient(45deg, #d4d4d4 25%, transparent 25%),' +
        'linear-gradient(-45deg, #d4d4d4 25%, transparent 25%),' +
        'linear-gradient(45deg, transparent 75%, #d4d4d4 75%),' +
        'linear-gradient(-45deg, transparent 75%, #d4d4d4 75%)';
    } else {
      cropChecker.style.backgroundColor = fillBg === 'white' ? '#fff' : '#000';
      cropChecker.style.backgroundImage = 'none';
    }
    // info
    const rW = natW ? (box.w * natW / 100).toFixed(0) : '?';
    const rH = natH ? (box.h * natH / 100).toFixed(0) : '?';
    let ratioStr = 'free';
    if (lockedRatio !== null) {
      const found = CROP_RATIOS.find(r => r.value === lockedRatio);
      ratioStr = found ? found.label : lockedRatio.toFixed(2);
    }
    infoEl.textContent = `${box.w.toFixed(1)}% × ${box.h.toFixed(1)}% · ${rW}×${rH}px · ${ratioStr}`;
  }

  // ── drag & resize interaction ──

  let mode = null; // 'move' | 'resize'
  let resizeDir = '';
  let startMX, startMY, startBox;

  cropBox.addEventListener('mousedown', e => {
    e.preventDefault();
    e.stopPropagation();
    const handle = e.target.closest('.crop-handle');
    if (handle) {
      mode = 'resize';
      resizeDir = handle.dataset.dir;
    } else {
      mode = 'move';
    }
    startMX = e.clientX;
    startMY = e.clientY;
    startBox = { ...box };
    window.addEventListener('mousemove', onDrag);
    window.addEventListener('mouseup', onDragEnd);
  });

  function onDrag(e) {
    const rect = canvas.getBoundingClientRect();
    const dx = (e.clientX - startMX) / rect.width * 100;
    const dy = (e.clientY - startMY) / rect.height * 100;

    // Crop box may extend past the image edges (transparent-fill margins).
    // Sanity caps below prevent runaway values but allow values outside [0, 100].
    const CAP_LO = -200, CAP_HI = 300;
    const capPos = v => Math.max(CAP_LO, Math.min(CAP_HI, v));
    const capSize = v => Math.max(5, Math.min(500, v));

    if (mode === 'move') {
      box.x = capPos(startBox.x + dx);
      box.y = capPos(startBox.y + dy);
    } else if (mode === 'resize') {
      let { x, y, w, h } = startBox;
      const dir = resizeDir;

      // compute new edges (allow extending past image bounds)
      if (dir.includes('w')) { const nx = Math.min(x + w - 5, x + dx); w = w - (nx - x); x = nx; }
      if (dir.includes('e')) { w = Math.max(5, w + dx); }
      if (dir.includes('n')) { const ny = Math.min(y + h - 5, y + dy); h = h - (ny - y); y = ny; }
      if (dir.includes('s')) { h = Math.max(5, h + dy); }

      // enforce ratio (centered or anchored, no edge clamps)
      if (lockedRatio !== null && natW) {
        const targetPctRatio = lockedRatio * natH / natW; // w_pct / h_pct
        if (dir === 'n' || dir === 's') {
          const newW = h * targetPctRatio;
          const cx = x + w / 2;
          x = cx - newW / 2;
          w = newW;
        } else if (dir === 'w' || dir === 'e') {
          const newH = w / targetPctRatio;
          const cy = y + h / 2;
          y = cy - newH / 2;
          h = newH;
        } else {
          // corner: derive h from w, anchor opposite corner
          const newH = w / targetPctRatio;
          if (dir.includes('n')) { y = startBox.y + startBox.h - newH; h = newH; }
          else { h = newH; }
        }
      }

      box = { x: capPos(x), y: capPos(y), w: capSize(w), h: capSize(h) };
    }
    updateBoxDOM();
  }

  function onDragEnd() {
    mode = null;
    window.removeEventListener('mousemove', onDrag);
    window.removeEventListener('mouseup', onDragEnd);
  }
}

function attachToolbarActions() {
  const page = document.getElementById('page');
  page.removeEventListener('click', handleToolbarAction);
  page.addEventListener('click', handleToolbarAction);
}

function handleToolbarAction(e) {
  const btn = e.target.closest('[data-tb]');
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  const action = btn.dataset.tb;
  const cp = btn.dataset.cellPath;

  if (action === 'edit') {
    openCropOverlay(cp);
  } else if (action === 'move-left') {
    moveCell(cp, -1);
  } else if (action === 'move-right') {
    moveCell(cp, 1);
  } else if (action === 'replace') {
    if (cp.startsWith('intro:')) {
      const id = cp.slice('intro:'.length);
      const def = data[id]?.intro?.video ? 'video' : 'image';
      const media = chooseMediaType(def);
      pendingReplace = { type: 'intro', id, media };
      fileInput.accept = media === 'video' ? 'video/*,.gif' : 'image/*';
    } else {
      const cell = tryGetNested(data, cp);
      const def = cell?.video ? 'video' : 'image';
      const media = chooseMediaType(def);
      pendingReplace = { type: 'cell', path: cp, media };
      fileInput.accept = media === 'video' ? 'video/*,.gif' : 'image/*';
    }
    fileInput.value = '';
    fileInput.click();
  } else if (action === 'delete') {
    deleteImage(cp);
  } else if (action === 'trim-video') {
    openVideoTrim(cp);
  } else if (action === 'intro-clear') {
    const id = cp.slice('intro:'.length);
    delete data[id].intro;
    if (replacedImages[cp]) {
      URL.revokeObjectURL(replacedImages[cp].url);
      delete replacedImages[cp];
    }
    if (replacedVideos[cp]) {
      URL.revokeObjectURL(replacedVideos[cp].url);
      delete replacedVideos[cp];
    }
    cropEdits.delete(cp);
    markCropEdit(cp);
    showProject(currentId, true);
    updateStatus();
  } else if (action === 'intro-reset-crop') {
    setCropObj(cp, null);
    markCropEdit(cp);
    showProject(currentId, true);
    updateStatus();
  }
}

function openVideoTrim(cp) {
  let target;
  let src = '';
  if (cp.startsWith('intro:')) {
    const id = cp.slice('intro:'.length);
    if (!data[id].intro) return;
    target = data[id].intro;
    src = replacedVideos[cp]?.url || (target.video ? videoUrl(data[id].folder, target.video) : '');
  } else {
    target = tryGetNested(data, cp);
    if (target?.video) {
      const pid = cp.split('.')[0];
      src = replacedVideos[cp]?.url || videoUrl(data[pid].folder, target.video);
    }
  }
  if (!target || !target.video || !src || isGifName(target.video)) return;

  const current = target.videoTrim || { start: 0, end: 0 };
  const overlay = document.createElement('div');
  overlay.className = 'crop-overlay';
  overlay.innerHTML = `
    <div class="trim-modal">
      <video class="trim-video-preview" src="${src}" controls muted playsinline preload="metadata"></video>
      <div class="trim-controls">
        <div class="trim-tabs">
          <button class="trim-tab active" data-len="0">full</button>
          <button class="trim-tab" data-len="5">5s</button>
          <button class="trim-tab" data-len="10">10s</button>
          <button class="trim-tab" data-len="15">15s</button>
          <button class="trim-tab" data-len="30">30s</button>
        </div>
        <div class="trim-range"><span>start</span><input id="trim-start" type="range" min="0" max="0" step="0.1"><span id="trim-start-v">0.0s</span></div>
        <div class="trim-range"><span>end</span><input id="trim-end" type="range" min="0" max="0" step="0.1"><span id="trim-end-v">0.0s</span></div>
        <div style="display:flex;gap:.5rem;justify-content:flex-end">
          <button class="crop-cancel-btn" data-trim-cancel>cancel</button>
          <button class="crop-apply-btn" data-trim-apply>apply</button>
        </div>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const video = overlay.querySelector('.trim-video-preview');
  const startR = overlay.querySelector('#trim-start');
  const endR = overlay.querySelector('#trim-end');
  const startV = overlay.querySelector('#trim-start-v');
  const endV = overlay.querySelector('#trim-end-v');

  const close = () => overlay.remove();
  overlay.querySelector('[data-trim-cancel]').addEventListener('click', close);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  const setLabels = () => {
    startV.textContent = `${Number(startR.value).toFixed(1)}s`;
    const ev = Number(endR.value);
    endV.textContent = `${ev <= 0 ? 'full' : `${ev.toFixed(1)}s`}`;
  };
  const clampRanges = () => {
    const s = Number(startR.value), e = Number(endR.value), d = Number(endR.max);
    if (e > 0 && e <= s) endR.value = Math.min(d, s + 0.1).toFixed(1);
    setLabels();
  };
  const applyLoopPreview = () => {
    const s = Number(startR.value), e = Number(endR.value);
    if (video.currentTime < s) video.currentTime = s;
    if (e > 0 && video.currentTime >= e) video.currentTime = s;
  };
  video.addEventListener('timeupdate', applyLoopPreview);

  video.addEventListener('loadedmetadata', () => {
    const d = Number(video.duration || 0);
    startR.max = String(d);
    endR.max = String(d);
    startR.value = String(Math.min(current.start || 0, d));
    endR.value = String((current.end && current.end > 0) ? Math.min(current.end, d) : 0);
    setLabels();
    video.currentTime = Number(startR.value) || 0;
  }, { once: true });

  startR.addEventListener('input', clampRanges);
  endR.addEventListener('input', clampRanges);

  overlay.querySelectorAll('.trim-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      overlay.querySelectorAll('.trim-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const len = Number(btn.dataset.len || 0);
      const d = Number(endR.max || 0);
      if (len <= 0) {
        endR.value = '0';
      } else {
        const s = Number(startR.value);
        endR.value = String(Math.min(d, s + len));
      }
      clampRanges();
    });
  });

  overlay.querySelector('[data-trim-apply]').addEventListener('click', () => {
    target.videoTrim = {
      start: +Number(startR.value).toFixed(2),
      end: +Number(endR.value).toFixed(2),
    };
    close();
    showProject(currentId, true);
    updateStatus();
  });
}

function deleteImage(cp) {
  deletedImages.add(cp);
  if (replacedImages[cp]) {
    URL.revokeObjectURL(replacedImages[cp].url);
    delete replacedImages[cp];
  }
  if (replacedVideos[cp]) {
    URL.revokeObjectURL(replacedVideos[cp].url);
    delete replacedVideos[cp];
  }
  cropEdits.delete(cp);
  const cell = getDisplayCell(cp);
  if (cell) cell._deleted = true;
  showProject(currentId, true);
  updateStatus();
}

function hasPathPrefix(path, prefix) {
  return path === prefix || path.startsWith(prefix + '.');
}

function remapStatePaths(remap) {
  const remapped = {};
  for (const [k, v] of Object.entries(replacedImages)) remapped[remap(k)] = v;
  for (const k of Object.keys(replacedImages)) delete replacedImages[k];
  Object.assign(replacedImages, remapped);
  const remappedVideos = {};
  for (const [k, v] of Object.entries(replacedVideos)) remappedVideos[remap(k)] = v;
  for (const k of Object.keys(replacedVideos)) delete replacedVideos[k];
  Object.assign(replacedVideos, remappedVideos);

  const nextCrop = new Set();
  for (const cp of cropEdits) nextCrop.add(remap(cp));
  cropEdits.clear();
  nextCrop.forEach(cp => cropEdits.add(cp));

  const nextDeleted = new Set();
  for (const cp of deletedImages) nextDeleted.add(remap(cp));
  deletedImages.clear();
  nextDeleted.forEach(cp => deletedImages.add(cp));
}

function swapRowStatePaths(a, b) {
  remapStatePaths(path => {
    if (hasPathPrefix(path, a)) return b + path.slice(a.length);
    if (hasPathPrefix(path, b)) return a + path.slice(b.length);
    return path;
  });
}

function swapCellStatePaths(a, b) {
  remapStatePaths(path => {
    if (path === a) return b;
    if (path === b) return a;
    return path;
  });
}

function moveCell(cp, dir) {
  const m = cp.match(/^(.*\.cells)\.(\d+)$/);
  if (!m) return;
  const cells = getNested(data, m[1]);
  const idx = Number(m[2]);
  const next = idx + dir;
  if (!Array.isArray(cells) || next < 0 || next >= cells.length) return;
  [cells[idx], cells[next]] = [cells[next], cells[idx]];
  swapCellStatePaths(`${m[1]}.${idx}`, `${m[1]}.${next}`);
  showProject(currentId, true);
  updateStatus();
}

function markCropEdit(cp) {
  if (cp.startsWith('hero:')) {
    const [, id, source] = cp.split(':');
    const cur = heroData[id]?.[source + 'Crop'] || null;
    const orig = originalHeroData[id]?.[source + 'Crop'] || null;
    if (JSON.stringify(cur) !== JSON.stringify(orig)) cropEdits.add(cp);
    else cropEdits.delete(cp);
    return;
  }
  if (cp.startsWith('intro:')) {
    const id = cp.slice('intro:'.length);
    const cur = data[id]?.intro?.crop || null;
    const orig = originalData[id]?.intro?.crop || null;
    if (JSON.stringify(cur) !== JSON.stringify(orig)) cropEdits.add(cp);
    else cropEdits.delete(cp);
    return;
  }
  // Cell crop. Cells without an originalData entry (newly added) treat any crop as a change.
  const cur = getDisplayCell(cp)?.crop || null;
  let origCell;
  try { origCell = getNested(originalData, cp); } catch { origCell = null; }
  const orig = origCell?.crop || null;
  if (JSON.stringify(cur) !== JSON.stringify(orig)) cropEdits.add(cp);
  else cropEdits.delete(cp);
}

function attachEditable() {
  document.querySelectorAll('[contenteditable]').forEach(el => {
    el.addEventListener('input', () => {
      setNested(data, el.dataset.path, el.textContent);
      el.classList.toggle('changed', el.textContent !== el.dataset.orig);
      updateStatus();
    });
  });

  document.querySelectorAll('[data-path-input]').forEach(el => {
    const orig = decodeURIComponent(el.dataset.origRaw || '');
    el.addEventListener('input', () => {
      setNested(data, el.dataset.pathInput, el.value);
      el.classList.toggle('changed', el.value !== orig);
      updateStatus();
    });
  });
}

function attachNav() {
  document.querySelectorAll('[data-nav]').forEach(a => {
    a.addEventListener('click', () => guardSwitch(a.dataset.nav));
  });
}

/* ── image replacement ── */
let pendingReplace = null;
const fileInput = document.getElementById('file-input');

function chooseMediaType(defaultType = 'image') {
  const answer = window.prompt('Choose media type: "image" or "video"', defaultType);
  return String(answer || defaultType).trim().toLowerCase() === 'video' ? 'video' : 'image';
}

function openFilePickerForMedia(type) {
  fileInput.accept = type === 'video' ? 'video/*,.gif' : 'image/*';
  fileInput.value = '';
  fileInput.click();
}

// Preserve upload detail in editor workflow:
// keep source resolution unless extremely large, and export WebP at high quality.
async function convertToWebp(file) {
  if (file.type === 'image/webp') return { blob: file, lgBlob: file, name: file.name };
  let bitmap;
  try {
    bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (e) {
    console.warn('[convert] createImageBitmap failed, uploading original:', e.message);
    return { blob: file, lgBlob: null, name: file.name };
  }
  const stem = file.name.replace(/\.[^.]+$/, '') || 'image';
  // Hard cap is only to avoid pathological browser memory spikes on huge images.
  const HARD_MAX_EDGE = 4096;
  const srcMaxEdge = Math.max(bitmap.width, bitmap.height);
  const mainMaxEdge = Math.min(HARD_MAX_EDGE, srcMaxEdge);
  const lgMaxEdge = Math.min(HARD_MAX_EDGE, Math.max(srcMaxEdge, 3000));
  const render = (maxEdge, quality) => new Promise((resolve, reject) => {
    const scale = Math.min(1, maxEdge / srcMaxEdge);
    const w = Math.max(1, Math.round(bitmap.width * scale));
    const h = Math.max(1, Math.round(bitmap.height * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
    canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob returned null')), 'image/webp', quality);
  });
  try {
    const [blob, lgBlob] = await Promise.all([
      render(mainMaxEdge, 0.95),
      render(lgMaxEdge, 0.95),
    ]);
    return { blob, lgBlob, name: stem + '.webp' };
  } finally {
    bitmap.close?.();
  }
}

function attachImageClick() {
  document.querySelectorAll('.img-missing').forEach(el => {
    el.setAttribute('tabindex', '0');
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', 'Add media — click or press Enter');
  });

  const page = document.getElementById('page');
  page.removeEventListener('click', handleImageDelegation);
  page.removeEventListener('keydown', handleImageKeyDelegation);
  page.addEventListener('click', handleImageDelegation);
  page.addEventListener('keydown', handleImageKeyDelegation);
}

function handleImageDelegation(e) {
  const el = e.target.closest('.img-missing');
  if (!el) return;
  if (el.closest('.crop-active')) return;
  e.preventDefault();
  const cp = el.dataset.cellPath;
  const media = chooseMediaType(cp?.startsWith('intro:') ? 'video' : 'image');
  pendingReplace = cp?.startsWith('intro:')
    ? { type: 'intro', id: cp.slice('intro:'.length), media }
    : { type: 'cell', path: cp, media };
  openFilePickerForMedia(media);
}

function handleImageKeyDelegation(e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const el = e.target.closest('.img-missing');
  if (!el) return;
  if (el.closest('.crop-active')) return;
  e.preventDefault();
  const cp = el.dataset.cellPath;
  const media = chooseMediaType(cp?.startsWith('intro:') ? 'video' : 'image');
  pendingReplace = cp?.startsWith('intro:')
    ? { type: 'intro', id: cp.slice('intro:'.length), media }
    : { type: 'cell', path: cp, media };
  openFilePickerForMedia(media);
}

function attachHeroClick() {
  document.querySelectorAll('.hero-card img').forEach(el => {
    el.setAttribute('tabindex', '0');
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', 'Replace hero image — click or press Enter');
    function triggerReplace(e) {
      if (el.closest('.crop-active')) return;
      e.preventDefault();
      if (el.dataset.introId) {
        pendingReplace = { type: 'intro', id: el.dataset.introId };
      } else {
        pendingReplace = { type: 'hero', id: el.dataset.heroId, source: el.dataset.heroSource };
      }
      openFilePickerForMedia('image');
    }
    el.addEventListener('click', triggerReplace);
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') triggerReplace(e);
    });
  });
}

fileInput.addEventListener('change', async () => {
  if (!fileInput.files.length || !pendingReplace) return;
  const file = fileInput.files[0];
  const media = pendingReplace.media || 'image';
  const converted = media === 'video'
    ? { blob: file, lgBlob: null, name: file.name }
    : await convertToWebp(file);
  const url = URL.createObjectURL(converted.blob);

  if (pendingReplace.type === 'cell') {
    const cp = pendingReplace.path;
    const cell = getDisplayCell(cp);
    if (media === 'video') {
      if (replacedImages[cp]) { URL.revokeObjectURL(replacedImages[cp].url); delete replacedImages[cp]; }
      replacedVideos[cp] = { ...converted, url };
      if (cell) {
        delete cell.img;
        delete cell.crop;
        cell.video = cell.video || 'new-video';
      }
      cropEdits.delete(cp);
    } else {
      if (replacedVideos[cp]) { URL.revokeObjectURL(replacedVideos[cp].url); delete replacedVideos[cp]; }
      replacedImages[cp] = { ...converted, url };
      if (cell) {
        delete cell.video;
        cell.img = cell.img || 'new-image';
      }
    }
    // Un-delete the cell if it was previously deleted (re-add flow).
    if (cell && cell._deleted) {
      delete cell._deleted;
      deletedImages.delete(cp);
    }
    showProject(currentId, true);
  } else if (pendingReplace.type === 'hero') {
    const key = `hero:${pendingReplace.id}:${pendingReplace.source}`;
    replacedImages[key] = { ...converted, url };
    const imgEl = document.querySelector(`img[data-hero-id="${pendingReplace.id}"][data-hero-source="${pendingReplace.source}"]`);
    if (imgEl) {
      imgEl.src = url;
      const card = imgEl.closest('.hero-card');
      if (card && !card.querySelector('.replaced-badge'))
        card.insertAdjacentHTML('beforeend', '<span class="replaced-badge" style="position:absolute;top:22px;left:4px">NEW</span>');
    }
  } else if (pendingReplace.type === 'intro') {
    const id = pendingReplace.id;
    const key = `intro:${id}`;
    if (!data[id].intro) data[id].intro = {};
    if (media === 'video') {
      if (replacedImages[key]) { URL.revokeObjectURL(replacedImages[key].url); delete replacedImages[key]; }
      replacedVideos[key] = { ...converted, url };
      delete data[id].intro.img;
      delete data[id].intro.crop;
      data[id].intro.video = data[id].intro.video || 'new-video';
    } else {
      if (replacedVideos[key]) { URL.revokeObjectURL(replacedVideos[key].url); delete replacedVideos[key]; }
      replacedImages[key] = { ...converted, url };
      delete data[id].intro.video;
      delete data[id].intro.videoTrim;
      if (!data[id].intro.img) data[id].intro.img = 'new-image';
    }
    showProject(currentId, true);
  }

  updateStatus();
  pendingReplace = null;
});

/* ── row layout controls (draft system) ── */
function attachRowControls() {
  document.querySelectorAll('[data-action="add-cell"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const rp = btn.dataset.rowPath;
      const row = getNested(data, rp);
      if (!row.cells) row.cells = [];
      row.cells.push({ img: 'new-image', explain: '' });
      showProject(currentId, true);
      updateStatus();
    });
  });

  document.querySelectorAll('[data-action="add-row"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const cp = btn.dataset.chapterPath;
      const ch = getNested(data, cp);
      if (!ch.rows) ch.rows = [];
      ch.rows.push({ cells: [{ img: 'new-image', explain: '' }], cap: '' });
      showProject(currentId, true);
      updateStatus();
    });
  });

  document.querySelectorAll('[data-action="delete-row"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const rp = btn.dataset.rowPath;
      const m = rp.match(/^(.*\.rows)\.(\d+)$/);
      if (!m) return;
      const rows = getNested(data, m[1]);
      const idx = Number(m[2]);
      if (!Array.isArray(rows) || idx < 0 || idx >= rows.length) return;
      cleanupRemovedPaths(rp);
      rows.splice(idx, 1);
      showProject(currentId, true);
      updateStatus();
    });
  });

  document.querySelectorAll('[data-action="move-row-up"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const rp = btn.dataset.rowPath;
      const m = rp.match(/^(.*\.rows)\.(\d+)$/);
      if (!m) return;
      const rows = getNested(data, m[1]);
      const idx = Number(m[2]);
      const prev = idx - 1;
      if (!Array.isArray(rows) || prev < 0 || idx >= rows.length) return;
      [rows[prev], rows[idx]] = [rows[idx], rows[prev]];
      swapRowStatePaths(`${m[1]}.${prev}`, `${m[1]}.${idx}`);
      showProject(currentId, true);
      updateStatus();
    });
  });

  document.querySelectorAll('[data-action="move-row-down"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const rp = btn.dataset.rowPath;
      const m = rp.match(/^(.*\.rows)\.(\d+)$/);
      if (!m) return;
      const rows = getNested(data, m[1]);
      const idx = Number(m[2]);
      const next = idx + 1;
      if (!Array.isArray(rows) || idx < 0 || next >= rows.length) return;
      [rows[idx], rows[next]] = [rows[next], rows[idx]];
      swapRowStatePaths(`${m[1]}.${idx}`, `${m[1]}.${next}`);
      showProject(currentId, true);
      updateStatus();
    });
  });
}

function attachChapterControls() {
  document.querySelectorAll('[data-action="delete-chapter"]').forEach(btn => {
    btn.addEventListener('click', () => deleteChapter(+btn.dataset.chapterIdx));
  });
}

function cleanupRemovedPaths(prefix) {
  for (const key of Object.keys(replacedImages)) {
    if (key.startsWith(prefix)) {
      URL.revokeObjectURL(replacedImages[key].url);
      delete replacedImages[key];
    }
  }
  for (const key of Object.keys(replacedVideos)) {
    if (key.startsWith(prefix)) {
      URL.revokeObjectURL(replacedVideos[key].url);
      delete replacedVideos[key];
    }
  }
  for (const cp of cropEdits) {
    if (cp.startsWith(prefix)) cropEdits.delete(cp);
  }
  for (const cp of deletedImages) {
    if (cp.startsWith(prefix)) deletedImages.delete(cp);
  }
}

function deleteChapter(idx) {
  const chapters = data[currentId].chapters;
  if (!chapters || idx < 0 || idx >= chapters.length) return;
  const ch = chapters[idx];
  const label = ch.note || ch.title || `Chapter ${idx + 1}`;
  if (!confirm(`Delete "${label}"?\nThis cannot be undone (until reset).`)) return;

  const prefix = `${currentId}.chapters.${idx}`;
  cleanupRemovedPaths(prefix);
  chapters.splice(idx, 1);
  showProject(currentId);
  updateStatus();
}

function updateStatus() {
  const textChanges = document.querySelectorAll('.changed').length;
  const imgChanges = Object.keys(replacedImages).length + Object.keys(replacedVideos).length;
  const cropCount = cropEdits.size;
  const deleteCount = deletedImages.size;
  const n = textChanges + imgChanges + cropCount + deleteCount;
  const parts = [];
  if (textChanges) parts.push(`${textChanges} text`);
  if (imgChanges)  parts.push(`${imgChanges} img`);
  if (cropCount)   parts.push(`${cropCount} crop`);
  if (deleteCount) parts.push(`${deleteCount} deleted`);
  const s = document.getElementById('status');
  s.textContent = n ? parts.join(' · ') : 'No changes';
  s.className = n ? 'status has-changes' : 'status';

  const saveBtn = document.getElementById('btn-save-disk');
  if (saveBtn) saveBtn.classList.toggle('pulse', n > 0);
}

function hasUnsavedChanges() {
  const textChanges = document.querySelectorAll('.changed').length;
  const imgChanges = Object.keys(replacedImages).length + Object.keys(replacedVideos).length;
  const cropCount = cropEdits.size;
  const deleteCount = deletedImages.size;
  return textChanges + imgChanges + cropCount + deleteCount;
}

function guardSwitch(targetId) {
  if (targetId === currentId) return;
  const n = hasUnsavedChanges();
  if (n > 0) {
    const parts = [];
    const tc = document.querySelectorAll('.changed').length;
    const ic = Object.keys(replacedImages).length + Object.keys(replacedVideos).length;
    const cc = cropEdits.size;
    const delc = deletedImages.size;
    if (tc) parts.push(`${tc} text edit(s)`);
    if (ic) parts.push(`${ic} image replacement(s)`);
    if (cc) parts.push(`${cc} crop change(s)`);
    if (delc) parts.push(`${delc} image deletion(s)`);
    if (!confirm(`You have unsaved changes: ${parts.join(', ')}.\n\nSwitch project anyway? Changes will remain in memory but make sure to export before closing.`)) return;
  }
  showProject(targetId);
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = order.map(id =>
    `<button class="tab" role="tab" aria-selected="${id === currentId}" data-id="${id}">${data[id].name}</button>`
  ).join('');
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => guardSwitch(t.dataset.id));
  });
}
