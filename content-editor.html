function esc(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n'); }
function pad(n) { return '  '.repeat(n); }
function sv(v,l) {
  if (v==null) return 'null';
  if (typeof v==='string') return `'${esc(v)}'`;
  if (typeof v==='number'||typeof v==='boolean') return String(v);
  if (Array.isArray(v)) return sa(v,l);
  return so(v,l);
}
function sa(a,l) {
  if (!a.length) return '[]';
  if (a.length<=2&&a.every(x=>typeof x==='string'||typeof x==='number')) return `[${a.map(x=>sv(x,0)).join(', ')}]`;
  if (Array.isArray(a[0])&&a[0].length===2&&typeof a[0][0]==='string')
    return `[\n${a.map(p=>pad(l+1)+`[${sv(p[0],0)},${' '.repeat(Math.max(1,12-p[0].length))}${sv(p[1],0)}],`).join('\n')}\n${pad(l)}]`;
  if (a.every(x=>typeof x==='string')) return `[\n${a.map(x=>pad(l+1)+sv(x,l+1)+',').join('\n')}\n${pad(l)}]`;
  return `[\n${a.map(x=>pad(l+1)+sv(x,l+1)+',').join('\n')}\n${pad(l)}]`;
}
function so(o,l) {
  const e=Object.entries(o);
  if (o.w!==undefined&&o.nat) return `{ x: ${o.x}, y: ${o.y}, w: ${o.w}, h: ${o.h}, nat: [${o.nat[0]}, ${o.nat[1]}], bg: '${cropBgValue(o)}' }`;
  if (e.length<=4&&e.every(([,v])=>typeof v==='string'||typeof v==='boolean'||typeof v==='number')) return `{ ${e.map(([k,v])=>`${k}: ${sv(v,0)}`).join(', ')} }`;
  if (o.img!==undefined || o.video!==undefined) {
    let s = `{ ${o.video!==undefined ? `video: ${sv(o.video,0)}` : `img: ${sv(o.img,0)}`}`;
    if(o.explain!==undefined) s += `, explain: ${sv(o.explain,0)}`;
    if(o.cap!==undefined) s += `, cap: ${sv(o.cap,0)}`;
    if(o.crop && o.video===undefined) s += `, crop: ${sv(o.crop,0)}`;
    return s + ' }';
  }
  if (o.cells) { let s=`{ cells: ${sv(o.cells,l+1)}`; if(o.cap)s+=`, cap: ${sv(o.cap,0)}`; return s+' }'; }
  return `{\n${e.map(([k,v])=>pad(l+1)+`${k}: ${sv(v,l+1)},`).join('\n')}\n${pad(l)}}`;
}

function doPreview() {
  const previewData = JSON.parse(JSON.stringify(data));

  // strip deleted cells and empty rows from preview data
  for (const pid of Object.keys(previewData)) {
    const p = previewData[pid];
    if (p.chapters) p.chapters.forEach(ch => {
      if (ch.rows) {
        ch.rows.forEach(row => {
          if (row.cells) row.cells = row.cells.filter(c => !c._deleted);
        });
        ch.rows = ch.rows.filter(row => !row.cells || row.cells.length > 0);
      }
    });
  }

  // inject replaced image blob URLs as _src overrides
  for (const [key, entry] of Object.entries(replacedImages)) {
    if (key.startsWith('hero:')) continue;
    if (key.startsWith('intro:')) {
      const id = key.slice('intro:'.length);
      if (previewData[id]) {
        if (!previewData[id].intro) previewData[id].intro = { img: '' };
        previewData[id].intro._src = entry.url;
      }
      continue;
    }
    try {
      const parts = key.split('.');
      const pid = parts.shift();
      let target = previewData[pid];
      for (const k of parts) target = target[isNaN(k) ? k : +k];
      target._src = entry.url;
    } catch(e) {}
  }
  for (const [key, entry] of Object.entries(replacedVideos)) {
    if (key.startsWith('hero:')) continue;
    if (key.startsWith('intro:')) {
      const id = key.slice('intro:'.length);
      if (previewData[id]) {
        if (!previewData[id].intro) previewData[id].intro = {};
        previewData[id].intro._vsrc = entry.url;
      }
      continue;
    }
    try {
      const parts = key.split('.');
      const pid = parts.shift();
      let target = previewData[pid];
      for (const k of parts) target = target[isNaN(k) ? k : +k];
      target._vsrc = entry.url;
    } catch(e) {}
  }
  for (const [key, entry] of Object.entries(replacedVideos)) {
    if (key.startsWith('hero:') || key.startsWith('intro:')) continue;
    try {
      const parts = key.split('.');
      const pid = parts.shift();
      let target = previewData[pid];
      for (const k of parts) target = target[isNaN(k) ? k : +k];
      target._vsrc = entry.url;
    } catch(e) {}
  }

  const win = window.open(`project-detail.html?project=${currentId}&preview=1`, '_blank');
  if (!win) {
    showToast('Preview blocked — allow popups for this site', false);
    return;
  }
  window._latestPreviewPayload = { win, dossiers: previewData, order };
}

// One persistent listener — always sends the most recent payload to its window.
// Replaces the per-call listener that could leave stale handlers around.
window.addEventListener('message', e => {
  if (e.data?.type !== 'preview-ready') return;
  const p = window._latestPreviewPayload;
  if (!p || !p.win || p.win.closed) return;
  p.win.postMessage({ type: 'editor-preview', dossiers: p.dossiers, order: p.order }, '*');
});

function stripDeleted(obj) {
  const clone = JSON.parse(JSON.stringify(obj));
  if (clone.chapters) clone.chapters.forEach(ch => {
    if (ch.rows) {
      ch.rows.forEach(row => {
        if (row.cells) row.cells = row.cells.filter(c => !c._deleted);
        // Layout is now derived from cell count — drop legacy `kind` so saved files stay clean.
        delete row.kind;
        // A `cap` only makes sense on multi-cell rows; single-cell rows use the cell's own caption.
        if (row.cells && row.cells.length <= 1) delete row.cap;
      });
      ch.rows = ch.rows.filter(row => !row.cells || row.cells.length > 0);
    }
  });
  return clone;
}

function doExport() {
  const dm = srcText.match(/const DOSSIERS\s*=\s*\{/);
  let depth=0, end=dm.index;
  for (let i=dm.index;i<srcText.length;i++){if(srcText[i]==='{')depth++;else if(srcText[i]==='}'){depth--;if(!depth){end=i+1;break;}}}
  const blocks = order.map(id => {
    const d=stripDeleted(data[id]);
    return `\n    /* ================================================================\n       ${(d.name||id).toUpperCase()}\n       ================================================================ */\n    '${id}': ${sv(d,2)},`;
  });
  const out = srcText.slice(0,dm.index)+`const DOSSIERS = {\n${blocks.join('\n')}\n  }`+srcText.slice(end);
  dl(out, 'project-detail.js', 'text/javascript');

  // export network.js / specimens.js if any hero crops changed
  const hasHeroCrops = Object.values(heroData).some(h => h.networkCrop || h.specimensCrop);
  const hadHeroCrops = Object.values(originalHeroData).some(h => h.networkCrop || h.specimensCrop);
  if (hasHeroCrops || hadHeroCrops) {
    dl(injectHeroCrops(netSrcText, 'network'), 'network.js', 'text/javascript');
    dl(injectHeroCrops(specSrcText, 'specimens'), 'specimens.js', 'text/javascript');
  }
}

function injectHeroCrops(src, source) {
  let out = src;
  // remove existing heroCrop lines
  out = out.replace(/\s*heroCrop:\s*\{[^}]*\},?\s*\n?/g, '\n');
  // inject heroCrop after hero: lines for each project that has one
  for (const [id, h] of Object.entries(heroData)) {
    const crop = h[source + 'Crop'];
    if (!crop) continue;
    const cropStr = isNewCrop(crop)
      ? `{ x: ${crop.x}, y: ${crop.y}, w: ${crop.w}, h: ${crop.h}, nat: [${crop.nat[0]}, ${crop.nat[1]}], bg: '${cropBgValue(crop)}' }`
      : `{ s: ${crop.s}, x: ${crop.x}, y: ${crop.y} }`;
    const heroLineRe = new RegExp(`(id:\\s*'${id}'[\\s\\S]*?hero:\\s*.+?)([,\\s]*\\}|,\\s*\\n)`);
    out = out.replace(heroLineRe, (match, before, after) => {
      return before + `,\n      heroCrop: ${cropStr}` + after;
    });
  }
  return out;
}

async function doExportImages() {
  const keys = [...Object.keys(replacedImages), ...Object.keys(replacedVideos)];
  if (!keys.length) return;
  for (const key of keys) {
    const entry = replacedImages[key] || replacedVideos[key];
    let filename;
    if (key.startsWith('hero:')) {
      const [, id, source] = key.split(':');
      const origPath = heroData[id]?.[source] || '';
      filename = origPath.split('/').pop() || `hero-${id}-${source}.${entry.name.split('.').pop()}`;
    } else {
      const cell = tryGetNested(data, key);
      if (!cell) continue;
      if (cell.video) filename = cell.video;
      else filename = `${cell.img}.${entry.name.split('.').pop()}`;
    }
    dl(null, filename, null, entry.url);
    await new Promise(r => setTimeout(r, 300));
  }
}

function dl(content, name, type, href) {
  const a = document.createElement('a');
  a.href = href || URL.createObjectURL(new Blob([content], {type}));
  a.download = name;
  a.click();
}

function showToast(msg, ok) {
  const el = document.getElementById('save-toast');
  el.textContent = msg;
  el.className = 'save-toast show ' + (ok ? 'ok' : 'err');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.className = 'save-toast'; }, 3500);
}

function buildExportedJS() {
  const dm = srcText.match(/const DOSSIERS\s*=\s*\{/);
  let depth = 0, end = dm.index;
  for (let i = dm.index; i < srcText.length; i++) {
    if (srcText[i] === '{') depth++;
    else if (srcText[i] === '}') { depth--; if (!depth) { end = i + 1; break; } }
  }
  const blocks = order.map(id => {
    const d = stripDeleted(data[id]);
    return `\n    /* ================================================================\n       ${(d.name || id).toUpperCase()}\n       ================================================================ */\n    '${id}': ${sv(d, 2)},`;
  });
  return srcText.slice(0, dm.index) + `const DOSSIERS = {\n${blocks.join('\n')}\n  }` + srcText.slice(end);
}

async function doSaveToDisk() {
  const btn = document.getElementById('btn-save-disk');
  btn.textContent = 'Saving…';
  btn.disabled = true;

  const _saveLog = { mismatched: 0 };
  console.group('[save] start');
  console.log(`  replaced media: ${Object.keys(replacedImages).length + Object.keys(replacedVideos).length}`);
  for (const [k, e] of Object.entries(replacedImages)) {
    console.log(`    ${k} ← "${e.name}" (${e.blob.type || '?'}, ${e.blob.size} B)`);
  }
  for (const [k, e] of Object.entries(replacedVideos)) {
    console.log(`    ${k} ← "${e.name}" (${e.blob.type || '?'}, ${e.blob.size} B)`);
  }
  console.log(`  crops: ${cropEdits.size}, deletes: ${deletedImages.size}, textChanges: ${document.querySelectorAll('.changed').length}`);
  console.groupEnd();

  try {
    // 1. Rename any 'new-image' placeholder cells to a unique slug derived from the upload filename,
    //    so the JS we save below already references the final stems.
    const usedStems = new Set();
    const usedVideoNames = new Set();
    for (const pid of Object.keys(data)) {
      (data[pid].chapters || []).forEach(ch => (ch.rows || []).forEach(row => {
        (row.cells || []).forEach(c => {
          if (c.img && c.img !== 'new-image') usedStems.add(`${pid}/${c.img}`);
          if (c.video && c.video !== 'new-video') usedVideoNames.add(`${pid}/${c.video}`);
        });
      }));
    }
    const slugify = s => (s || 'image')
      .toLowerCase()
      .replace(/\.[a-z0-9]+$/i, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 60) || 'image';
    for (const [key, entry] of Object.entries(replacedImages)) {
      if (key.startsWith('hero:')) continue;
      if (key.startsWith('intro:')) {
        const id = key.slice('intro:'.length);
        const cfg = data[id]?.intro;
        if (!cfg) continue;
        if (cfg.img && cfg.img !== 'new-image' && cfg.img !== '') {
          usedStems.add(`${id}/${cfg.img}`);
          continue;
        }
        let stem = slugify(entry.name), candidate = stem, n = 2;
        while (usedStems.has(`${id}/${candidate}`)) candidate = `${stem}-${n++}`;
        cfg.img = candidate;
        usedStems.add(`${id}/${candidate}`);
        continue;
      }
      const cell = tryGetNested(data, key);
      if (!cell || (cell.img && cell.img !== 'new-image')) continue;
      const pid = key.split('.')[0];
      let stem = slugify(entry.name), candidate = stem, n = 2;
      while (usedStems.has(`${pid}/${candidate}`)) candidate = `${stem}-${n++}`;
      cell.img = candidate;
      usedStems.add(`${pid}/${candidate}`);
    }
    for (const [key, entry] of Object.entries(replacedVideos)) {
      if (key.startsWith('hero:')) continue;
      if (key.startsWith('intro:')) {
        const id = key.slice('intro:'.length);
        const cfg = data[id]?.intro;
        if (!cfg) continue;
        if (cfg.video && cfg.video !== 'new-video') {
          usedVideoNames.add(`${id}/${cfg.video}`);
          continue;
        }
        const ext = (entry.name.split('.').pop() || 'mp4').toLowerCase();
        let stem = slugify(entry.name), candidate = `${stem}.${ext}`, n = 2;
        while (usedVideoNames.has(`${id}/${candidate}`)) candidate = `${stem}-${n++}.${ext}`;
        cfg.video = candidate;
        delete cfg.img;
        delete cfg.crop;
        usedVideoNames.add(`${id}/${candidate}`);
        continue;
      }
      const cell = tryGetNested(data, key);
      if (!cell) continue;
      if (cell.video && cell.video !== 'new-video') {
        usedVideoNames.add(`${key.split('.')[0]}/${cell.video}`);
        continue;
      }
      const pid = key.split('.')[0];
      const ext = (entry.name.split('.').pop() || 'mp4').toLowerCase();
      let stem = slugify(entry.name), candidate = `${stem}.${ext}`, n = 2;
      while (usedVideoNames.has(`${pid}/${candidate}`)) candidate = `${stem}-${n++}.${ext}`;
      cell.video = candidate;
      delete cell.img;
      delete cell.crop;
      usedVideoNames.add(`${pid}/${candidate}`);
    }

    // 3. Save project-detail.js
    const jsContent = buildExportedJS();
    let resp = await fetch('/api/save-js', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: 'project-detail.js', content: jsContent }),
    });
    if (!resp.ok) throw new Error('Failed to save project-detail.js: ' + (await resp.text()));
    srcText = jsContent;

    // 4. Save hero crop changes to network.js / specimens.js
    const hasHeroCrops = Object.values(heroData).some(h => h.networkCrop || h.specimensCrop);
    const hadHeroCrops = Object.values(originalHeroData).some(h => h.networkCrop || h.specimensCrop);
    if (hasHeroCrops || hadHeroCrops) {
      const netOut = injectHeroCrops(netSrcText, 'network');
      resp = await fetch('/api/save-js', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: 'network.js', content: netOut }),
      });
      if (!resp.ok) throw new Error('Failed to save network.js');
      netSrcText = netOut;

      const specOut = injectHeroCrops(specSrcText, 'specimens');
      resp = await fetch('/api/save-js', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: 'specimens.js', content: specOut }),
      });
      if (!resp.ok) throw new Error('Failed to save specimens.js');
      specSrcText = specOut;
    }

    // 5. Save replaced images/videos to disk
    let imgSaved = 0;
    for (const [key, entry] of Object.entries(replacedImages)) {
      let targetPath;
      let rendererPath = null;
      let kind = 'cell';
      if (key.startsWith('hero:')) {
        kind = 'hero';
        const [, id, source] = key.split(':');
        targetPath = heroData[id]?.[source] || '';
        if (!targetPath) continue;
      } else if (key.startsWith('intro:')) {
        kind = 'intro';
        const id = key.slice('intro:'.length);
        const cfg = data[id]?.intro;
        if (!cfg || !cfg.img) continue;
        const ext = (entry.name.split('.').pop() || 'webp').toLowerCase();
        targetPath = `${IMG_BASE}${data[id].folder}/images/webp/${cfg.img}.${ext}`;
        rendererPath = `${IMG_BASE}${data[id].folder}/images/webp/${cfg.img}.webp`;

        // Also save an `${stem}-lg.${ext}` copy because introSection uses imgSrcLg.
        const lgPath = `${IMG_BASE}${data[id].folder}/images/webp/${cfg.img}-lg.${ext}`;
        const lgFd = new FormData();
        lgFd.append('file', entry.lgBlob || entry.blob, entry.name);
        lgFd.append('path', lgPath);
        const lgResp = await fetch('/api/save-image', { method: 'POST', body: lgFd });
        console.log(`[save]   HTTP ${lgResp.status} → ${lgPath}`);
        if (!lgResp.ok) throw new Error(`Failed to save image ${lgPath}: ${await lgResp.text()}`);
        imgSaved++;
      } else {
        const cell = tryGetNested(data, key);
        if (!cell) continue;
        const pid = key.split('.')[0];
        const ext = (entry.name.split('.').pop() || 'webp').toLowerCase();
        targetPath = `${IMG_BASE}${data[pid].folder}/images/webp/${cell.img}.${ext}`;
        rendererPath = `${IMG_BASE}${data[pid].folder}/images/webp/${cell.img}.webp`;
      }

      const mismatch = rendererPath && targetPath !== rendererPath;
      console.group(`[save] ${kind} ${key}`);
      if (kind === 'cell') {
        const cell = getNested(data, key);
        if (cell) console.log(`  cell.img = "${cell.img}"`);
      } else if (kind === 'intro') {
        console.log(`  intro.img = "${data[key.slice('intro:'.length)]?.intro?.img}"`);
      }
      console.log(`  target   = ${targetPath}`);
      if (rendererPath) console.log(`  renderer = ${rendererPath}`);
      if (mismatch) {
        console.warn('  ⚠ EXTENSION MISMATCH — file will be saved but won\'t render. Pre-convert with scripts/convert-originals-to-webp.py before uploading.');
        _saveLog.mismatched++;
      }
      console.groupEnd();

      const fd = new FormData();
      fd.append('file', entry.blob, entry.name);
      fd.append('path', targetPath);
      resp = await fetch('/api/save-image', { method: 'POST', body: fd });
      console.log(`[save]   HTTP ${resp.status} → ${targetPath}`);
      if (!resp.ok) throw new Error(`Failed to save image ${targetPath}: ${await resp.text()}`);
      imgSaved++;
    }
    for (const [key, entry] of Object.entries(replacedVideos)) {
      let targetPath = '';
      if (key.startsWith('hero:')) continue;
      if (key.startsWith('intro:')) {
        const id = key.slice('intro:'.length);
        const cfg = data[id]?.intro;
        if (!cfg || !cfg.video) continue;
        targetPath = `${IMG_BASE}${data[id].folder}/videos/${cfg.video}`;
      } else {
        const cell = tryGetNested(data, key);
        if (!cell || !cell.video) continue;
        const pid = key.split('.')[0];
        targetPath = `${IMG_BASE}${data[pid].folder}/videos/${cell.video}`;
      }
      const fd = new FormData();
      fd.append('file', entry.blob, entry.name);
      fd.append('path', targetPath);
      resp = await fetch('/api/save-image', { method: 'POST', body: fd });
      console.log(`[save]   HTTP ${resp.status} → ${targetPath}`);
      if (!resp.ok) throw new Error(`Failed to save media ${targetPath}: ${await resp.text()}`);
      imgSaved++;
    }

    // 5. Clear state — changes are now persisted
    Object.keys(replacedImages).forEach(k => {
      URL.revokeObjectURL(replacedImages[k].url);
      delete replacedImages[k];
    });
    Object.keys(replacedVideos).forEach(k => {
      URL.revokeObjectURL(replacedVideos[k].url);
      delete replacedVideos[k];
    });
    cropEdits.clear();
    deletedImages.clear();
    // Strip _deleted cells (and emptied rows) from in-memory data so the editor
    // matches what was just written. Without this the red placeholders stick
    // around even though the saved file no longer references those cells.
    for (const pid of Object.keys(data)) {
      const p = data[pid];
      if (p.chapters) p.chapters.forEach(ch => {
        if (ch.rows) {
          ch.rows.forEach(row => {
            if (row.cells) row.cells = row.cells.filter(c => !c._deleted);
          });
          ch.rows = ch.rows.filter(row => !row.cells || row.cells.length > 0);
        }
      });
    }
    originalData = JSON.parse(JSON.stringify(data));
    originalHeroData = JSON.parse(JSON.stringify(heroData));

    showProject(currentId);
    updateStatus();

    console.log(`[save] done — project-detail.js + ${imgSaved} image(s)${_saveLog.mismatched ? `, ${_saveLog.mismatched} with extension mismatch` : ''}`);

    const parts = [];
    parts.push('project-detail.js');
    if (imgSaved) parts.push(`${imgSaved} image(s)`);
    let toastMsg = 'Saved: ' + parts.join(' + ');
    if (_saveLog.mismatched) {
      toastMsg += `  ⚠ ${_saveLog.mismatched} non-webp upload — pre-convert with scripts/convert-originals-to-webp.py to make it render`;
    }
    showToast(toastMsg, !_saveLog.mismatched);
  } catch (e) {
    showToast('Error: ' + e.message, false);
    console.error('Save to project failed:', e);
  } finally {
    btn.textContent = 'Save to project';
    btn.disabled = false;
  }
}

/* ══════════════════════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════════════════════ */

loadSource().then(() => {
  renderTabs();
  showProject(order[0]);
  document.getElementById('btn-preview').onclick = doPreview;
  document.getElementById('btn-save-disk').onclick = doSaveToDisk;
  document.getElementById('btn-reset').onclick = () => {
    data = JSON.parse(JSON.stringify(originalData));
    heroData = JSON.parse(JSON.stringify(originalHeroData));
    Object.keys(replacedImages).forEach(k => { URL.revokeObjectURL(replacedImages[k].url); delete replacedImages[k]; });
    Object.keys(replacedVideos).forEach(k => { URL.revokeObjectURL(replacedVideos[k].url); delete replacedVideos[k]; });
    cropEdits.clear();
    deletedImages.clear();
    showProject(currentId);
    updateStatus();
  };
}).catch(e => {
  document.getElementById('page').innerHTML = `<p style="color:#f87171;padding:3rem;font-family:monospace">${e.message}</p>`;
});
</script>
